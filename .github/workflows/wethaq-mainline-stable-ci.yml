name: Wethaq Mainline Stable CI

on:
  push:
    branches:
      - main
      - foundation/mainline-stable-20260905
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wethaq-mainline-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-verify:
    name: Validate, build and verify CI APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
          cache-read-only: true
          validate-wrappers: true

      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f backend/package.json
          test -f backend/server.js
          test -f backend/smoke-test.mjs
          test -f backend/security-smoke-test.mjs
          test -f scripts/mainline_stable_audit.py
          git diff --check
          if grep -RInE -- '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|storePassword[[:space:]]+["'"'][^"'"']+["'"']|keyPassword[[:space:]]+["'"'][^"'"']+["'"']' app/src backend scripts; then
            echo 'Hardcoded private-key or credential material detected outside build configuration.'
            exit 1
          fi

      - name: Mainline architecture and security audit
        shell: bash
        run: python3 scripts/mainline_stable_audit.py

      - name: Backend install and syntax validation
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check smoke-test.mjs
          node --check security-smoke-test.mjs
          node --input-type=module -e "import Database from 'better-sqlite3'; const db=new Database(':memory:'); db.prepare('select 1').get(); db.close(); console.log('BETTER_SQLITE3_NATIVE_OK')"

      - name: Backend health and security smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3100
          export DB_PATH="$RUNNER_TEMP/wethaq-mainline-ci.sqlite"
          export JWT_SECRET='wethaq-mainline-ci-only-secret'
          export OWNER_WETHAQ_ID='ci-owner'
          rm -f "$DB_PATH" "$RUNNER_TEMP/wethaq-mainline-backend.log"
          node server.js > "$RUNNER_TEMP/wethaq-mainline-backend.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wethaq-mainline-backend.log" || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/health
          echo
          node security-smoke-test.mjs
          PORT=3100 node smoke-test.mjs
          echo 'WETHAQ_BACKEND_HEALTH_SECURITY_AND_FUNCTIONAL_SMOKE_OK'

      - name: Build CI release candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test assembleCi --stacktrace --console=plain

      - name: Verify CI APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/ci/app-ci.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/ci/SHA256SUMS.txt
          echo 'WETHAQ_CI_APK_VERIFY_OK'

      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-CI-Validation-${{ github.sha }}
          path: |
            app/build/outputs/apk/ci/app-ci.apk
            app/build/outputs/apk/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

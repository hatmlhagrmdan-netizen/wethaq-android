name: Wethaq clean rebuild fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[clean-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and clean
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import okhttp3.*\n', 'import okhttp3.*\nimport okhttp3.RequestBody.Companion.toRequestBody\n')
          s=s.replace('setBackgroundColor(::bg.get().let{Color.rgb(247,249,250)})', 'setBackgroundColor(Color.rgb(247,249,250))')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f wethaq-android-final-fixed.zip wethaq-android-project.zip Screenshot_٢٠٢٥١٢٢٠-٠١٢٦٠١_2.jpg
          git diff --check
      - name: Verify clean client
        run: |
          test -f app/src/main/res/drawable/profile_photo.jpg
          grep -q 'R.drawable.profile_photo' app/src/main/java/com/wethaq/app/MainActivity.kt
          grep -q 'import okhttp3.RequestBody.Companion.toRequestBody' app/src/main/java/com/wethaq/app/MainActivity.kt
          grep -q 'setBackgroundColor(Color.rgb(247,249,250))' app/src/main/java/com/wethaq/app/MainActivity.kt
      - name: Commit final clean source and remove this fixer
        run: |
          git config user.name "wethaq-clean-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm .github/workflows/rebuild-cleanup.yml
          git commit -m "إعادة بناء وثاق بالكامل وتنظيف النسخة القديمة [clean-rebuild]"
          git push

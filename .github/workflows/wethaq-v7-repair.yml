name: Wethaq V7 Repair

on:
  push:
    branches: [wethaq-v6-repair]
  workflow_dispatch:

permissions:
  contents: write

env:
  V7_TRIGGER: '2'

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Extract and run the tested V6 repair script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          s=Path('.github/workflows/wethaq-v6-repair.yml').read_text(encoding='utf-8')
          a=s.find("          python3 <<'PY'")
          if a<0: raise SystemExit('repair script marker missing')
          a=s.find('\n',a)+1
          b=s.find('\n          PY',a)
          if b<0: raise SystemExit('repair script end missing')
          Path('/tmp/repair.py').write_text(dedent(s[a:b])+'\n',encoding='utf-8')
          PY
          python3 /tmp/repair.py
      - name: Validate source
        run: |
          git diff --check
          node --check backend/server.js
          grep -R "المناصب الإدارية مدفوعة\|20\\$ / سنة\|17\\$ / سنة\|12\\$ / سنة\|8\\$ / سنة\|addModerationTargetCard\|applyAudioRoute\|expires_at\|resolveUser" app/src/main/java backend/server.js >/dev/null
      - name: Backend install and hard health smoke
        working-directory: backend
        shell: bash
        run: |
          npm install --no-audit --no-fund
          export DB_PATH="$RUNNER_TEMP/wethaq-v7.db"
          export JWT_SECRET="wethaq-v7-secret"
          export OWNER_WETHAQ_ID="Hatem_Hussin_Al_Haj_Ramadan1995"
          export PORT=3199
          node server.js > "$RUNNER_TEMP/wethaq-v7-server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(60):
            try:
              with urllib.request.urlopen('http://127.0.0.1:3199/health',timeout=1) as r:
                d=json.loads(r.read().decode())
                if r.status==200 and d.get('ok') is True: print('HEALTH_OK'); break
            except Exception: pass
            time.sleep(.25)
          else:
            print(open('/runner/_temp/wethaq-v7-server.log').read()); raise SystemExit('HEALTH_GATE_FAILED')
          PY
          node smoke-test.mjs
      - name: Android Release build
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'wethaq-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/AdminActivity.java app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java app/src/main/java/com/wethaq/app/WethaqMessageService.java app/src/main/java/com/wethaq/app/IncomingCallActionReceiver.java app/src/main/java/com/wethaq/app/VideoCallActivity.java app/src/main/AndroidManifest.xml backend/server.js
          if git diff --cached --quiet; then echo SOURCE_ALREADY_REPAIRED; exit 0; fi
          git commit -m 'feat: complete Wethaq V7 product repair'
          git push origin HEAD:wethaq-v6-repair
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wethaq-v7-repaired-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

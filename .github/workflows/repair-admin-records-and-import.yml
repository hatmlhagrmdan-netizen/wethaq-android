name: Wethaq repair administration records and import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-admin-records-and-import.yml'
      - 'backend/server.js'
      - 'app/src/main/java/com/wethaq/app/AdminAccessActivity.java'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair backend admin records, authorization and Android import
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ap=Path('app/src/main/java/com/wethaq/app/AdminAccessActivity.java')
          a=ap.read_text(encoding='utf-8')
          if 'import android.widget.TextView;' not in a:
              a=a.replace('import android.widget.ScrollView;\n', 'import android.widget.ScrollView;\nimport android.widget.TextView;\n', 1)
              ap.write_text(a, encoding='utf-8')
              print('ADDED_TEXTVIEW_IMPORT')

          bp=Path('backend/server.js')
          s=bp.read_text(encoding='utf-8')

          # Remove private birth year from the public administration board.
          old_member="function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,birth_year:row.birth_year,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'',appointedAt:row.appointed_at||null}}"
          new_member="function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'',appointedAt:row.appointed_at||null}}"
          if old_member in s:
              s=s.replace(old_member,new_member,1)
          elif new_member not in s:
              raise SystemExit('publicAdminMember definition not found')

          # Canonical founder-only audit endpoint. Admin members must never read the audit log.
          audit_route="app.get('/api/admin/audit-log',adminAuth,(req,res)=>{if(req.adminRow.role!=='founder')return res.status(403).json({error:'founder_only'});const limit=Math.min(200,Math.max(1,Number(req.query.limit||200)));const rows=db.prepare(`SELECT a.created_at,a.action,a.role,a.details,u.name actor_name,u.wethaq_id actor_wethaq_id FROM admin_audit_log a LEFT JOIN users u ON u.id=a.actor_user_id ORDER BY a.id DESC LIMIT ?`).all(limit);res.json({entries:rows})});"
          pattern=r"app\.get\('/api/admin/audit-log'.*?(?=\napp\.|\Z)"
          if re.search(pattern,s,re.S):
              s=re.sub(pattern,audit_route,s,count=1,flags=re.S)
          else:
              anchor="app.get('/health'"
              if anchor not in s: raise SystemExit('health anchor missing')
              s=s.replace(anchor,audit_route+'\n'+anchor,1)

          marker='// WETHAQ_ADMIN_RECORDS_V2'
          if marker not in s:
              block=r'''// WETHAQ_ADMIN_RECORDS_V2
const ADMIN_RECORD_LIMIT=200;
const ADMIN_RECORDS_INIT=`CREATE TABLE IF NOT EXISTS user_login_log(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL,login_type TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,ip_address TEXT,user_agent TEXT,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);CREATE INDEX IF NOT EXISTS idx_user_login_log_created ON user_login_log(created_at DESC);CREATE TABLE IF NOT EXISTS admin_position_history(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL,role TEXT NOT NULL,appointed_by INTEGER,appointed_by_role TEXT,appointed_at TEXT NOT NULL,expires_at TEXT,ended_at TEXT,code_version INTEGER NOT NULL DEFAULT 1,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE,FOREIGN KEY(appointed_by) REFERENCES users(id) ON DELETE SET NULL);CREATE INDEX IF NOT EXISTS idx_admin_position_history_user ON admin_position_history(user_id,id DESC);`;
 db.exec(ADMIN_RECORDS_INIT);
 function recordLogin(userId,loginType,req){try{db.prepare('INSERT INTO user_login_log(user_id,login_type,ip_address,user_agent) VALUES(?,?,?,?)').run(Number(userId),String(loginType),String(req?.ip||''),String(req?.headers?.['user-agent']||''));}catch(e){console.error('login audit write failed',e.message)}}
 function recordPosition(userId,role,actorId,actorRole,appointedAt,expiresAt,codeVersion){try{db.prepare('INSERT INTO admin_position_history(user_id,role,appointed_by,appointed_by_role,appointed_at,expires_at,code_version) VALUES(?,?,?,?,?,?,?)').run(Number(userId),String(role),actorId?Number(actorId):null,actorRole||null,appointedAt,expiresAt||null,Number(codeVersion||1));}catch(e){console.error('position history write failed',e.message)}}
 function endPosition(userId,role,endedAt){try{db.prepare('UPDATE admin_position_history SET ended_at=? WHERE id=(SELECT id FROM admin_position_history WHERE user_id=? AND role=? AND ended_at IS NULL ORDER BY id DESC LIMIT 1)').run(endedAt,Number(userId),String(role));}catch(e){console.error('position history close failed',e.message)}}
 app.get('/api/admin/login-history',adminAuth,(req,res)=>{if(req.adminRow.role!=='founder')return res.status(403).json({error:'founder_only'});const limit=Math.min(ADMIN_RECORD_LIMIT,Math.max(1,Number(req.query.limit||ADMIN_RECORD_LIMIT)));const rows=db.prepare('SELECT l.created_at,l.login_type,u.name,u.wethaq_id FROM user_login_log l JOIN users u ON u.id=l.user_id ORDER BY l.id DESC LIMIT ?').all(limit);res.json({entries:rows});});
 app.get('/api/admin/position-history',adminAuth,(req,res)=>{if(req.adminRow.role!=='founder')return res.status(403).json({error:'founder_only'});const limit=Math.min(ADMIN_RECORD_LIMIT,Math.max(1,Number(req.query.limit||ADMIN_RECORD_LIMIT)));const rows=db.prepare('SELECT h.*,u.name,u.wethaq_id,ab.name appointed_by_name FROM admin_position_history h JOIN users u ON u.id=h.user_id LEFT JOIN users ab ON ab.id=h.appointed_by ORDER BY h.id DESC LIMIT ?').all(limit);res.json({entries:rows.map(r=>{const p=ADMIN_POLICY[r.role]||{};return {...r,role_label:p.label||r.role,icon:p.icon||'👤'};})});});
 '''
              anchor="app.get('/health'"
              if anchor not in s: raise SystemExit('health anchor missing')
              s=s.replace(anchor,block+anchor,1)
          bp.write_text(s,encoding='utf-8')
          print('ADMIN_HARDENING_REPAIR_APPLIED')
          PY
      - name: Validate patched source
        run: |
          python3 -m py_compile scripts/*.py
          node --check backend/server.js
          grep -q 'import android.widget.TextView;' app/src/main/java/com/wethaq/app/AdminAccessActivity.java
          grep -q '/api/admin/login-history' backend/server.js
          grep -q '/api/admin/position-history' backend/server.js
          git diff --check
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/AdminAccessActivity.java backend/server.js
          git commit -m 'fix: harden admin authorization and public privacy'
          git push

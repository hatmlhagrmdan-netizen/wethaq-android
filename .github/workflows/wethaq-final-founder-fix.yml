name: Wethaq Founder Exit Final Repair

on:
  push:
    branches:
      - fix-founder-dashboard-exit-final

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply verified founder navigation repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          admin = Path("app/src/main/java/com/wethaq/app/AdminAccessActivity.java")
          main = Path("app/src/main/java/com/wethaq/app/MainActivity.java")

          a = admin.read_text(encoding="utf-8")
          old_admin = 'if(isOwner())founderSession();else finish();'
          new_admin = 'finish();'
          count = a.count(old_admin)
          if count != 1:
              raise SystemExit(f"AdminAccessActivity repair target count={count}, expected=1")
          a = a.replace(old_admin, new_admin, 1)
          admin.write_text(a, encoding="utf-8")

          m = main.read_text(encoding="utf-8")
          old_main = 'private void home(){if(isOwner()){startActivity(new Intent(this,AdminAccessActivity.class));return;}'
          new_main = 'private void home(){'
          count = m.count(old_main)
          if count != 1:
              raise SystemExit(f"MainActivity repair target count={count}, expected=1")
          m = m.replace(old_main, new_main, 1)
          main.write_text(m, encoding="utf-8")
          PY

          git diff --check
          grep -F 'private void home(){' app/src/main/java/com/wethaq/app/MainActivity.java
          ! grep -F 'if(isOwner()){startActivity(new Intent(this,AdminAccessActivity.class));return;}' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -F 'logout.setOnClickListener(v->{prefs.edit().remove("admin_token").remove("admin_role").apply();adminToken="";finish();});' app/src/main/java/com/wethaq/app/AdminAccessActivity.java

      - name: Commit source repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wethaq-final-founder-fix.yml
          git add app/src/main/java/com/wethaq/app/AdminAccessActivity.java app/src/main/java/com/wethaq/app/MainActivity.java
          git commit -m "fix: founder panel exits to communication home [wethaq-final-fix]"
          git push origin HEAD:fix-founder-dashboard-exit-final

name: Fix founder dashboard v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-founder-dashboard-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch owner routing and admin API
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Owner identity must enter the founder dashboard directly after normal identity login.
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          if 'WETHAQ_FOUNDER_DIRECT_V2' not in s:
              marker=' private void home(){'
              if marker not in s: raise SystemExit('home method anchor missing')
              s=s.replace(marker, ' private void home(){ if(isOwner()){ startActivity(new Intent(this,AdminAccessActivity.class)); return; } // WETHAQ_FOUNDER_DIRECT_V2', 1)
              p.write_text(s,encoding='utf-8')

          # Backend additions.
          p=Path('backend/server.js')
          s=p.read_text(encoding='utf-8')
          if 'WETHAQ_FOUNDER_SESSION_V2' not in s:
              anchor="app.post('/api/admin/login',(req,res)=>{"
              if anchor not in s: raise SystemExit('admin login anchor missing')
              block="""// WETHAQ_FOUNDER_SESSION_V2
app.post('/api/admin/founder-session',auth,(req,res)=>{if(req.user?.wethaqId!==OWNER_WETHAQ_ID)return res.status(403).json({error:'founder_only'});const u=db.prepare('SELECT id,name,wethaq_id,birth_year FROM users WHERE id=?').get(Number(req.user.sub));if(!u)return res.status(404).json({error:'user_not_found'});db.prepare(`INSERT INTO admin_roles(user_id,role,code_hash,subscription_expires_at,appointed_by,appointed_by_role,appointed_at,active,code_version) VALUES(?,?,?,?,?,?,?,?,?) ON CONFLICT(user_id) DO UPDATE SET role='founder',subscription_expires_at=NULL,appointed_by=NULL,appointed_by_role=NULL,appointed_at=excluded.appointed_at,active=1`).run(u.id,'founder',null,null,null,null,now(),1,1);const r=activeAdminRole(u.id);res.json({ok:true,token:adminTokenFor(r),role:'founder',label:ADMIN_POLICY.founder.label});});
"""
              s=s.replace(anchor,block+anchor,1)

          if 'WETHAQ_ADMIN_WARN_V2' not in s:
              anchor="app.post('/api/admin/rbac/ban',adminAuth,(req,res)=>{"
              if anchor not in s: raise SystemExit('rbac ban anchor missing')
              block="""// WETHAQ_ADMIN_WARN_V2
app.post('/api/admin/rbac/warn',adminAuth,(req,res)=>{const targetId=String(req.body?.wethaqId||'').trim(),message=safeMessage(req.body?.message||'تنبيه من إدارة وَثاق');const target=db.prepare('SELECT id,name,wethaq_id FROM users WHERE wethaq_id=?').get(targetId);if(!target)return res.status(404).json({error:'user_not_found'});if(target.wethaq_id===OWNER_WETHAQ_ID)return res.status(400).json({error:'cannot_warn_owner'});const actor=db.prepare('SELECT id,name,wethaq_id FROM users WHERE id=?').get(req.adminRow.user_id);const body=`⚠️ تنبيه إداري من ${actor?.name||'إدارة وَثاق'}\\n\\n${message}`;const z=db.prepare(\"INSERT INTO messages(sender_id,receiver_id,body,status,message_type) VALUES(?,?,?,?,'admin_warning')\").run(actor.id,target.id,body,isOnline(target.id)?'delivered':'sent');const saved=db.prepare('SELECT * FROM messages WHERE id=?').get(z.lastInsertRowid);pushMessage(saved,actor,target);audit(actor.id,target.id,'warn',req.adminRow.role,message);res.status(201).json({ok:true,message_id:z.lastInsertRowid});});
"""
              s=s.replace(anchor,block+anchor,1)

          # Require the founder's supplied name/birth/personal code for a precise assignment.
          if 'WETHAQ_ASSIGN_IDENTITY_CHECK_V2' not in s:
              old="const targetId=String(req.body?.wethaqId||'').trim(),targetRole=String(req.body?.role||'').trim();"
              new="// WETHAQ_ASSIGN_IDENTITY_CHECK_V2\nconst targetId=String(req.body?.wethaqId||'').trim(),targetRole=String(req.body?.role||'').trim(),suppliedName=safeName(req.body?.name||''),suppliedBirth=Number(req.body?.birthYear||0),suppliedPersonal=String(req.body?.personalCode||'').trim();"
              if old not in s: raise SystemExit('assignment identity anchor missing')
              s=s.replace(old,new,1)
              old2="if(!target)return res.status(404).json({error:'user_not_found'});if(target.wethaq_id===OWNER_WETHAQ_ID||targetRole==='founder')"
              new2="if(!target)return res.status(404).json({error:'user_not_found'});if(suppliedName&&target.name!==suppliedName)return res.status(401).json({error:'assignment_name_mismatch'});if(suppliedBirth&&target.birth_year!==suppliedBirth)return res.status(401).json({error:'assignment_birth_mismatch'});if(suppliedPersonal&&!verifyPersonalCode(suppliedPersonal,db.prepare('SELECT personal_code_hash FROM users WHERE id=?').get(target.id)?.personal_code_hash))return res.status(401).json({error:'assignment_personal_code_invalid'});if(target.wethaq_id===OWNER_WETHAQ_ID||targetRole==='founder')"
              if old2 not in s: raise SystemExit('assignment target anchor missing')
              s=s.replace(old2,new2,1)

          p.write_text(s,encoding='utf-8')
          print('Founder dashboard patch prepared')
          PY
      - name: Commit patch
        run: |
          git config user.name 'wethaq-founder-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java backend/server.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Fix founder dashboard routing and admin controls'
          git push

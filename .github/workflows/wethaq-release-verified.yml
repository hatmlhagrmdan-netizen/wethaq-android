name: Wethaq Release Verified
on:
  push:
    branches: [main, development/wethaq-next-engineering-20260903, wethaq-v5-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static source gates
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f backend/server.js
          test -f backend/server-v7.js
          grep -q "com.android.application.*8.7.3" build.gradle
          grep -q "compileSdk 35" app/build.gradle
          node --check backend/server.js
          node --check backend/server-v7.js
      - name: Prepare production signing key
        shell: bash
        env:
          WETHAQ_KEYSTORE_BASE64: ${{ secrets.WETHAQ_KEYSTORE_BASE64 }}
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WETHAQ_KEYSTORE_BASE64" || { echo "::error::Missing WETHAQ_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$WETHAQ_KEYSTORE_PASSWORD" || { echo "::error::Missing WETHAQ_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$WETHAQ_KEY_ALIAS" || { echo "::error::Missing WETHAQ_KEY_ALIAS repository secret"; exit 1; }
          test -n "$WETHAQ_KEY_PASSWORD" || { echo "::error::Missing WETHAQ_KEY_PASSWORD repository secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/wethaq-release.keystore"
          printf '%s' "$WETHAQ_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "WETHAQ_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "WETHAQ_KEYSTORE_PASSWORD=$WETHAQ_KEYSTORE_PASSWORD"
            echo "WETHAQ_KEY_ALIAS=$WETHAQ_KEY_ALIAS"
            echo "WETHAQ_KEY_PASSWORD=$WETHAQ_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Validate production signing key
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WETHAQ_KEYSTORE_PATH"
          keytool -list -v -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" >/tmp/wethaq-keytool.txt
          grep -q 'Entry type: PrivateKeyEntry' /tmp/wethaq-keytool.txt
          grep -q 'SHA256: 64:4B:F1:1F:70:99:10:F4:FB:53:16:FB:76:E7:AD:FB:30:4C:03:71:62:69:F0:27:A7:BF:37:F7:45:DF:FE:D3' /tmp/wethaq-keytool.txt
          keytool -certreq -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" -keypass "$WETHAQ_KEY_PASSWORD" -file "$RUNNER_TEMP/wethaq-release.csr" >/tmp/wethaq-key-certreq.log 2>&1
          test -s "$RUNNER_TEMP/wethaq-release.csr"
          rm -f "$RUNNER_TEMP/wethaq-release.csr" /tmp/wethaq-keytool.txt /tmp/wethaq-key-certreq.log
      - name: Backend dependency and smoke checks
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check server-v7.js
          PORT=3100 WETHAQ_CORE_PORT=39091 node server-v7.js > /tmp/wethaq-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/health >/tmp/wethaq-health.json; then break; fi
            sleep 1
          done
          test -s /tmp/wethaq-health.json
          grep -q '\"version\":\"7.0.0\"' /tmp/wethaq-health.json
          PORT=3100 node smoke-test.mjs
          PORT=3100 node rbac-smoke.mjs
      - name: Android tests and signed release build
        shell: bash
        run: |
          set -euo pipefail
          test -f "$WETHAQ_KEYSTORE_PATH"
          gradle --no-daemon clean test assembleRelease
      - name: Verify APK integrity and production signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | sort | head -n 1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -q 'Signer #1 certificate DN:'
          "$APKSIGNER" verify --print-certs "$APK" | grep -q 'Signer #1 certificate SHA-256 digest:'
          "$APKSIGNER" verify --print-certs "$APK" | grep -q '64:4B:F1:1F:70:99:10:F4:FB:53:16:FB:76:E7:AD:FB:30:4C:03:71:62:69:F0:27:A7:BF:37:F7:45:DF:FE:D3'
          cp "$APK" "$RUNNER_TEMP/wethaq-release.apk"
          sha256sum "$RUNNER_TEMP/wethaq-release.apk"
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: wethaq-release-signed-${{ github.sha }}
          path: ${{ runner.temp }}/wethaq-release.apk
          if-no-files-found: error
          retention-days: 14

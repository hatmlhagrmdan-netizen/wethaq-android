name: Wethaq Release Verified
on:
  push:
    branches: [main, development/wethaq-next-engineering-20260903, wethaq-v5-repair]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static source gates
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f backend/server.js
          grep -q "com.android.application.*8.7.3" build.gradle
          grep -q "compileSdk 35" app/build.gradle
          node --check backend/server.js
      - name: Backend dependency and smoke checks
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --check server.js
      - name: Android tests and release build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test assembleRelease
      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wethaq-release-verified-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

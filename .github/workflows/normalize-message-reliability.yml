name: Wethaq Message Reliability Normalization
on:
  push:
    branches:
      - development/wethaq-next-engineering-20260903
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'message reliability normalization applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize duplicate migration statement
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text()
          duplicate="ensureColumn('messages','client_id','TEXT');db.exec(`CREATE UNIQUE INDEX IF NOT EXISTS idx_messages_sender_client ON messages(sender_id,client_id) WHERE client_id IS NOT NULL AND client_id<>''`);ensureColumn('messages','client_id','TEXT');db.exec(`CREATE UNIQUE INDEX IF NOT EXISTS idx_messages_sender_client ON messages(sender_id,client_id) WHERE client_id IS NOT NULL AND client_id<>''`);"
          single="ensureColumn('messages','client_id','TEXT');db.exec(`CREATE UNIQUE INDEX IF NOT EXISTS idx_messages_sender_client ON messages(sender_id,client_id) WHERE client_id IS NOT NULL AND client_id<>''`);"
          if duplicate not in s:
            raise SystemExit('EXPECTED_DUPLICATE_NOT_FOUND')
          s=s.replace(duplicate,single,1)
          if duplicate in s:
            raise SystemExit('DUPLICATE_REMAINS')
          p.write_text(s)
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'fix: normalize message reliability migration — message reliability normalization applied'
          git push
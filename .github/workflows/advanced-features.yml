name: Wethaq Advanced Features

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final repairs
        run: |
          set -euo pipefail
          python3 scripts/final_repair.py
          python3 scripts/media_repair.py
          python3 scripts/ui_repair.py
          python3 scripts/video_repair.py
          python3 scripts/contact_repair.py
          python3 scripts/notification_contact_video_repair.py
          python3 scripts/production_feature_repair.py
          python3 -m py_compile scripts/*.py

      - name: Normalize generated Java before compile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('q.put("name",fn);q.put("birthYear",Integer.parseInt(fy));','q.put("name",n);q.put("birthYear",Integer.parseInt(y));')
          s=s.replace('q.put("name",fn);', 'q.put("name",n);')
          s=s.replace('Integer.parseInt(fy)', 'Integer.parseInt(y)')
          p.write_text(s,encoding='utf-8')
          PY
          ! grep -q '\bfn\b\|\bfy\b' app/src/main/java/com/wethaq/app/MainActivity.java

      - name: Validate production feature wiring
        run: |
          set -euo pipefail
          grep -q 'pendingAudioData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'pendingImageData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'startAudioCall' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'private void send()' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'imageBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioOnly' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          node --check backend/server.js

      - name: Prepare ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/wethaq-ci-release.jks"
          ALIAS="wethaq-ci"
          PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Wethaq CI Validation, OU=Wethaq, O=Wethaq, L=CI, ST=CI, C=SY"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias "$ALIAS" >/dev/null
          {
            echo "WETHAQ_KEYSTORE_PATH=$KEYSTORE"
            echo "WETHAQ_KEYSTORE_PASSWORD=$PASS"
            echo "WETHAQ_KEY_ALIAS=$ALIAS"
            echo "WETHAQ_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Persist repaired Android source
        run: |
          set -euo pipefail
          git config user.name "Wethaq Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/VideoCallActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "fix: persist Wethaq production feature repairs [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -d app
          gradle --version
          test -s "$WETHAQ_KEYSTORE_PATH"

      - name: Build release APK
        run: gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          echo "WETHAQ_FINAL_RELEASE_APK_OK"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-APK-Final
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

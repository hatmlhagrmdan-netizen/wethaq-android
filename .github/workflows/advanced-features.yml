name: Wethaq Advanced Features

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final repairs
        run: |
          python3 scripts/final_repair.py
          python3 scripts/media_repair.py
          python3 scripts/ui_repair.py
          python3 scripts/video_repair.py
          python3 scripts/contact_repair.py
          python3 -m py_compile scripts/*.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -d app
          gradle --version

      - name: Build release APK
        run: gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh app/build/outputs/apk/release/app-release.apk
          echo "WETHAQ_FINAL_RELEASE_APK_OK"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-APK-Final
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

            ("function auth(req,res,next){const h=req.headers.authorization||'',t=h.startsWith('Bearer ')?h.slice(7):'';if(!t)return res.status(401).json({error:'unauthorized'});try{req.user=jwt.verify(t,JWT_SECRET);next()}catch{return res.status(401).json({error:'invalid_token'})}}",
             "function activeBan(userId){const b=db.prepare('SELECT * FROM bans WHERE user_id=? ORDER BY id DESC LIMIT 1').get(userId);if(!b)return null;if(b.ban_type==='temporary'&&b.expires_at&&new Date(b.expires_at)<=new Date()){db.prepare('DELETE FROM bans WHERE id=?').run(b.id);return null}return b}function auth(req,res,next){const h=req.headers.authorization||'',t=h.startsWith('Bearer ')?h.slice(7):'';if(!t)return res.status(401).json({error:'unauthorized'});try{req.user=jwt.verify(t,JWT_SECRET);const b=activeBan(Number(req.user.sub));if(b)return res.status(403).json({error:'user_banned',ban_type:b.ban_type,expires_at:b.expires_at||null,reason:b.reason||''});next()}catch{return res.status(401).json({error:'invalid_token'})}}function admin(req,res,next){if(req.user?.wethaqId!==OWNER_WETHAQ_ID)return res.status(403).json({error:'admin_only'});next()}"),
            ("app.post('/api/login',(req,res)=>{const x=identityInput(req,res);if(!x)return;let u=db.prepare('SELECT * FROM users WHERE name=? AND birth_year=?').get(x.name,x.birthYear);if(!u)return res.status(404).json({error:'user_not_found'});",
             "app.post('/api/login',(req,res)=>{const x=identityInput(req,res);if(!x)return;let u=db.prepare('SELECT * FROM users WHERE name=? AND birth_year=?').get(x.name,x.birthYear);if(!u)return res.status(404).json({error:'user_not_found'});const ban=activeBan(u.id);if(ban)return res.status(403).json({error:'user_banned',ban_type:ban.ban_type,expires_at:ban.expires_at||null,reason:ban.reason||''});"),
            ("app.get('/api/messages/:wethaqId',auth,(req,res)=>{const u=db.prepare('SELECT * FROM users WHERE wethaq_id=?').get(req.params.wethaqId);if(!u)return res.status(404).json({error:'user_not_found'});const rows=db.prepare(`SELECT m.* FROM messages m WHERE (sender_id=? AND receiver_id=?) OR (sender_id=? AND receiver_id=?) ORDER BY id ASC LIMIT 500`).all(req.user.sub,u.id,u.id,req.user.sub);",
             "app.get('/api/messages/:wethaqId',auth,(req,res)=>{const u=db.prepare('SELECT * FROM users WHERE wethaq_id=?').get(req.params.wethaqId);if(!u)return res.status(404).json({error:'user_not_found'});const rows=db.prepare(`SELECT m.*,su.name sender_name,su.wethaq_id sender_wethaq_id,ru.name receiver_name,ru.wethaq_id receiver_wethaq_id FROM messages m JOIN users su ON su.id=m.sender_id JOIN users ru ON ru.id=m.receiver_id WHERE (m.sender_id=? AND m.receiver_id=?) OR (m.sender_id=? AND m.receiver_id=?) ORDER BY m.id ASC LIMIT 500`).all(req.user.sub,u.id,u.id,req.user.sub);"),
            ("server.listen(PORT,'0.0.0.0',()=>console.log(`Wethaq backend listening on ${PORT}`));",
             "app.post('/api/complaints',auth,(req,res)=>{const message=safeMessage(req.body?.message||'أرغب بالتواصل مع مؤسس وَثاق');const owner=db.prepare('SELECT id FROM users WHERE wethaq_id=?').get(OWNER_WETHAQ_ID);if(!owner)return res.status(503).json({error:'owner_not_found'});if(owner.id===Number(req.user.sub))return res.status(400).json({error:'owner_cannot_complain_to_self'});const z=db.prepare(\"INSERT INTO messages(sender_id,receiver_id,body,status,message_type) VALUES(?,?,?,?,'text')\").run(req.user.sub,owner.id,message,isOnline(owner.id)?'delivered':'sent');db.prepare('INSERT INTO complaints(from_user_id,message) VALUES(?,?)').run(req.user.sub,message);res.status(201).json({ok:true,message_id:z.lastInsertRowid})});\napp.get('/api/admin/users',auth,admin,(req,res)=>{const q=safeName(req.query.q||'');const rows=q?db.prepare('SELECT id,wethaq_id,name,birth_year,last_seen FROM users WHERE wethaq_id LIKE ? OR name LIKE ? ORDER BY id DESC LIMIT 50').all(`%${q}%`,`%${q}%`):db.prepare('SELECT id,wethaq_id,name,birth_year,last_seen FROM users ORDER BY id DESC LIMIT 50').all();res.json({users:rows.map(u=>({...u,ban:activeBan(u.id)}))})});\napp.post('/api/admin/ban',auth,admin,(req,res)=>{const wethaqId=String(req.body?.wethaqId||'').trim(),minutes=Math.max(0,Number(req.body?.minutes||0)),reason=safeMessage(req.body?.reason||'بقرار من إدارة وَثاق');const u=db.prepare('SELECT id,wethaq_id,name FROM users WHERE wethaq_id=?').get(wethaqId);if(!u)return res.status(404).json({error:'user_not_found'});if(u.wethaq_id===OWNER_WETHAQ_ID)return res.status(400).json({error:'cannot_ban_owner'});db.prepare('DELETE FROM bans WHERE user_id=?').run(u.id);const type=minutes>0?'temporary':'permanent',expires=minutes>0?new Date(Date.now()+minutes*60000).toISOString():null;db.prepare('INSERT INTO bans(user_id,ban_type,expires_at,reason,created_by) VALUES(?,?,?,?,?)').run(u.id,type,expires,reason,req.user.sub);res.json({ok:true,wethaq_id:u.wethaq_id,ban_type:type,expires_at:expires})});\napp.post('/api/admin/unban',auth,admin,(req,res)=>{const u=db.prepare('SELECT id FROM users WHERE wethaq_id=?').get(String(req.body?.wethaqId||'').trim());if(!u)return res.status(404).json({error:'user_not_found'});db.prepare('DELETE FROM bans WHERE user_id=?').run(u.id);res.json({ok:true})});\napp.get('/api/admin/complaints',auth,admin,(req,res)=>{const rows=db.prepare('SELECT c.*,u.name from_name,u.wethaq_id from_wethaq_id FROM complaints c JOIN users u ON u.id=c.from_user_id ORDER BY c.id DESC LIMIT 100').all();res.json({complaints:rows})});\nserver.listen(PORT,'0.0.0.0',()=>console.log(`Wethaq backend listening on ${PORT}`));")
          ])


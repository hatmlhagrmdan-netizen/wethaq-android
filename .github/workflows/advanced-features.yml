name: Wethaq Advanced Features
# Final release-gate verification of the committed production source.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate committed source without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          python3 -m py_compile scripts/*.py
          node --check backend/server.js
          grep -q 'personalCode' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'personal_code_hash' backend/server.js
          grep -q "auth:'name_birth_year_personal_code'" backend/server.js
          grep -q 'invalid_personal_code' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          grep -q 'pendingAudioData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'pendingImageData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'startAudioCall' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'private void send()' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'imageBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioOnly' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'AdminAccessActivity' app/src/main/AndroidManifest.xml
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          git diff --check

      - name: Prepare ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/wethaq-ci-release.jks"
          ALIAS="wethaq-ci"
          PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Wethaq CI Validation, OU=Wethaq, O=Wethaq, L=CI, ST=CI, C=SY"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias "$ALIAS" >/dev/null
          {
            echo "WETHAQ_KEYSTORE_PATH=$KEYSTORE"
            echo "WETHAQ_KEYSTORE_PASSWORD=$PASS"
            echo "WETHAQ_KEY_ALIAS=$ALIAS"
            echo "WETHAQ_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          gradle --version
          test -s "$WETHAQ_KEYSTORE_PATH"

      - name: Build release APK
        run: gradle clean assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          echo "WETHAQ_FINAL_RELEASE_SOURCE=$GITHUB_SHA" > app/build/outputs/apk/release/PROVENANCE.txt
          echo "WETHAQ_FINAL_RELEASE_APK_OK"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-APK-Final
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

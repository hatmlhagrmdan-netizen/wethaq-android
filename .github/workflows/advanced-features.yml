name: Wethaq Advanced Features

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final repairs
        run: |
          python3 scripts/final_repair.py
          python3 scripts/media_repair.py
          python3 scripts/ui_repair.py
          python3 scripts/video_repair.py
          python3 scripts/contact_repair.py
          python3 scripts/notification_contact_video_repair.py
          python3 scripts/production_feature_repair.py
          python3 scripts/loading_repair.py
          python3 scripts/admin_ui_repair.py
          python3 scripts/spec_compliance_repair.py
          python3 scripts/final_hardening_repair.py
          python3 scripts/runtime_performance_repair.py
          python3 -m py_compile scripts/*.py

      - name: Normalize generated Java before compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('q.put("name",fn);q.put("birthYear",Integer.parseInt(fy));','q.put("name",n);q.put("birthYear",Integer.parseInt(y));')
          s=s.replace('q.put("name",fn);', 'q.put("name",n);')
          s=s.replace('Integer.parseInt(fy)', 'Integer.parseInt(y)')
          p.write_text(s,encoding='utf-8')
          PY
          ! grep -q '\bfn\b\|\bfy\b' app/src/main/java/com/wethaq/app/MainActivity.java

      - name: Validate production, security and specification wiring
        run: |
          grep -q 'pendingAudioData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'pendingImageData' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'startAudioCall' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'private void send()' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'imageBase64' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'audioOnly' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'warmBackend' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'private void setBusy(boolean busy)' app/src/main/java/com/wethaq/app/AdminActivity.java
          grep -q 'personal_code_hash' backend/server.js
          grep -q '/api/public/administration' backend/server.js
          grep -q '/api/admin/audit-log' backend/server.js
          grep -q '/api/profile/personal-code/verify' backend/server.js
          grep -q 'personalCodeHash' backend/server.js
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".AdminActivity" android:exported="false"' app/src/main/AndroidManifest.xml
          grep -q 'founderOnly' backend/server.js
          grep -q 'roleCanBan' backend/server.js
          grep -q 'pollInFlight' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'callIo' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          node --check backend/server.js
          python3 scripts/security_regression.py
          python3 scripts/final_release_guard.py

      - name: Persist repaired source
        run: |
          git config user.name "Wethaq Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/VideoCallActivity.java app/src/main/java/com/wethaq/app/AdminActivity.java app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java app/src/main/java/com/wethaq/app/WethaqUi.java app/src/main/java/com/wethaq/app/WethaqApp.java app/src/main/AndroidManifest.xml backend/server.js scripts/loading_repair.py scripts/admin_ui_repair.py scripts/spec_compliance_repair.py scripts/final_hardening_repair.py scripts/security_regression.py scripts/final_release_guard.py scripts/runtime_performance_repair.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: improve runtime performance calls and admin login security [skip ci]"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -d app
          gradle --version

      - name: Backend smoke test
        run: |
          cd backend
          npm install --no-audit --no-fund
          PORT=3100 NODE_ENV=test DB_PATH="$PWD/wethaq-smoke.db" JWT_SECRET=ci-only-smoke-secret node server.js > ../backend-smoke-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3100/health >/dev/null
          npm run test:smoke

      - name: Build release
        run: gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK provenance and integrity
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk | tee apk-sha256.txt
          echo "WETHAQ_FINAL_APK_OK"

      - name: Upload APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-Production-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
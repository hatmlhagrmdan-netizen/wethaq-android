              p=Path(path)
              s=p.read_text(encoding='utf-8')
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'PATCH FAILED: {path}: missing anchor: {old[:120]}')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')


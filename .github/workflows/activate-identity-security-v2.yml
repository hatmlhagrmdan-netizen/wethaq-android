name: Activate Identity Security V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_identity_security.py'
      - '.github/workflows/activate-identity-security-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 scripts/repair_identity_security.py
          python3 -m py_compile scripts/repair_identity_security.py
          node --check backend/server.js
          grep -q "personal_code_not_set" backend/server.js
          grep -q "if(!verifyPersonalCode(x.personalCode,u.personal_code_hash))" backend/server.js
          git diff --check
      - name: Commit backend hardening
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/server.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'fix: reject login without registered personal code'
          git push origin HEAD:main

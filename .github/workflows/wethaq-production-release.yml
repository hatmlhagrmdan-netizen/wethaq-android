name: Wethaq Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  WETHAQ_KEYSTORE_B64: ${{ secrets.WETHAQ_KEYSTORE_B64 }}
  WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
  WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
  WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}

jobs:
  production-release:
    name: Build and verify production APK
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
          validate-wrappers: true

      - name: Validate production signing inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WETHAQ_KEYSTORE_B64"
          test -n "$WETHAQ_KEYSTORE_PASSWORD"
          test -n "$WETHAQ_KEY_ALIAS"
          test -n "$WETHAQ_KEY_PASSWORD"

      - name: Materialize production keystore in runner temp
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/wethaq-production.jks"
          printf '%s' "$WETHAQ_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "WETHAQ_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Validate backend source
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check security-smoke-test.mjs

      - name: Build production release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test assembleRelease --stacktrace --console=plain

      - name: Verify production APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo 'WETHAQ_PRODUCTION_APK_VERIFY_OK'

      - name: Publish production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-production-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove production keystore
        if: always()
        shell: bash
        run: |
          rm -f "${WETHAQ_KEYSTORE_PATH:-$RUNNER_TEMP/wethaq-production.jks}"

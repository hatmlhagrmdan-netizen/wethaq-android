            exit 0
          fi
          git config user.name 'wethaq-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java \
                  app/src/main/java/com/wethaq/app/AdminActivity.java \
                  app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java \
                  app/src/main/java/com/wethaq/app/WethaqMessageService.java \
                  app/src/main/java/com/wethaq/app/IncomingCallActionReceiver.java \
                  app/src/main/java/com/wethaq/app/VideoCallActivity.java \
                  app/src/main/AndroidManifest.xml \
                  backend/server.js
          git commit -m 'feat: complete Wethaq V3 product repairs'
          git push origin HEAD:main


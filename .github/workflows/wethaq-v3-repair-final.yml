name: Wethaq V3 Repair Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final integrated repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def r(p): return Path(p).read_text(encoding='utf-8')
          def w(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              if old in s: return s.replace(old,new,1)
              if new in s: return s
              raise SystemExit(f'PATCH_MISSING: {label}')

          # Main screen + performance + coherent conversation layout.
          p='app/src/main/java/com/wethaq/app/MainActivity.java';s=r(p)
          s=once(s,'private final ExecutorService io=Executors.newSingleThreadExecutor();','private final ExecutorService io=Executors.newFixedThreadPool(4);','IO pool')
          s=once(s,'content.addView(me,lp(-1,-2,12));menu("⌕  البحث",this::searchScreen);','content.addView(me,lp(-1,-2,12));addAdminPricingNotice();menu("⌕  البحث",this::searchScreen);','home notice')
          anchor='private void publicAdministrationScreen(){startActivity(new Intent(this,PublicAdministrationActivity.class);}'
          insert='''private void publicAdministrationScreen(){startActivity(new Intent(this,PublicAdministrationActivity.class));}\n private void addAdminPricingNotice(){LinearLayout card=new LinearLayout(this);card.setOrientation(LinearLayout.VERTICAL);card.setPadding(dp(14),dp(12),dp(14),dp(12));GradientDrawable gd=new GradientDrawable();gd.setColor(Color.rgb(28,24,12));gd.setCornerRadius(dp(16));gd.setStroke(dp(2),gold());card.setBackground(gd);TextView title=tv("💼 المناصب الإدارية مدفوعة",18,Color.WHITE);title.setGravity(Gravity.RIGHT);title.setTypeface(Typeface.DEFAULT,Typeface.BOLD);card.addView(title);TextView body=tv("المناصب الإدارية في وَثاق مدفوعة لمدة سنة واحدة.\\nللحصول على منصب إداري، يرجى التواصل مع المدير العام ومؤسس وَثاق.",15,gold());body.setGravity(Gravity.RIGHT);card.addView(body);content.addView(card,lp(-1,-2,14));}'''
          s=once(s,anchor,insert,'pricing method')
          start=s.index(' private void conversation(String id,String n){');end=s.index(' private void loadMessages()',start)
          conv=''' private void conversation(String id,String n){stopPolling();activeId=id;activeName=n;root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(dp(10),dp(10),dp(10),dp(10));root.setBackgroundColor(Color.BLACK);LinearLayout header=new LinearLayout(this);header.setGravity(Gravity.CENTER_VERTICAL|Gravity.RIGHT);ImageView avatar=new ImageView(this);avatar.setScaleType(ImageView.ScaleType.CENTER_CROP);avatar.setImageDrawable(defaultAvatar());header.addView(avatar,new LinearLayout.LayoutParams(dp(58),dp(58)));LinearLayout names=new LinearLayout(this);names.setOrientation(LinearLayout.VERTICAL);TextView name=tv(n,19,Color.WHITE);name.setTypeface(Typeface.DEFAULT,Typeface.BOLD);TextView wid=tv(id,13,Color.LTGRAY);names.addView(name);names.addView(wid);header.addView(names,new LinearLayout.LayoutParams(0,-2,1));loadAvatarInto(id,avatar);root.addView(header,new LinearLayout.LayoutParams(-1,-2));LinearLayout calls=new LinearLayout(this);calls.setOrientation(LinearLayout.HORIZONTAL);Button video=btn("📹 فيديو"),audio=btn("📞 صوت");calls.addView(video,new LinearLayout.LayoutParams(0,dp(66),1));calls.addView(audio,new LinearLayout.LayoutParams(0,dp(66),1));root.addView(calls,lp(-1,-2,6));video.setOnClickListener(v->{click();startVideoCall();});audio.setOnClickListener(v->{click();startAudioCall();});TextView state=tv("المحادثة مهيأة للعمل بثبات مع ضعف الاتصال.",13,gold());state.setGravity(Gravity.CENTER);root.addView(state,lp(-1,-2,4));messages=new LinearLayout(this);messages.setOrientation(LinearLayout.VERTICAL);ScrollView sc=new ScrollView(this);sc.setFillViewport(true);sc.addView(messages);root.addView(sc,new LinearLayout.LayoutParams(-1,0,1));LinearLayout bar=new LinearLayout(this);bar.setGravity(Gravity.CENTER_VERTICAL);Button mic=btn("🎙"),gallery=btn("▧"),send=btn("إرسال");input=field("اكتب رسالة…");bar.addView(mic,new LinearLayout.LayoutParams(dp(58),dp(68)));bar.addView(gallery,new LinearLayout.LayoutParams(dp(58),dp(68)));bar.addView(input,new LinearLayout.LayoutParams(0,dp(68),1));bar.addView(send,new LinearLayout.LayoutParams(dp(82),dp(68)));root.addView(bar,lp(-1,-2,6));Button back=btn("‹ جهات الاتصال");root.addView(back,new LinearLayout.LayoutParams(-1,dp(64)));setContentView(root);back.setOnClickListener(v->{click();contactsScreen();});send.setOnClickListener(v->{click();send();});mic.setOnClickListener(v->{click();if(recording)stopRecording(true);else startRecording();});gallery.setOnClickListener(v->{click();pickImage();});loadMessages();startPolling();}\n'''
          s=s[:start]+conv+s[end:]
          w(p,s)

          # Public administration: exact price/permission matrix, one-year term.
          p='app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java';s=r(p)
          start=s.index('    private void show(String raw){');end=s.index('    private String nameOf',start)
          show='''    private void show(String raw){try{JSONObject o=new JSONObject(raw);body.removeAllViews();body.addView(card("💼 المناصب الإدارية مدفوعة\\nتُمنح لمدة سنة واحدة من تاريخ التعيين — الأسعار سنوية.",true));JSONObject f=o.optJSONObject("founder");body.addView(card("👑 المؤسس\\n"+(f==null?"غير محدد":f.optString("name","غير محدد"))+"\\nالصلاحيات: الإشراف الكامل، التعيين والعزل، الحظر والتنبيه والإشراف على جميع المناصب.",true));JSONObject d=o.optJSONObject("deputies");body.addView(roleCard("🥇 النائب الأول","20$ / سنة","أوسع صلاحيات بعد المؤسس: الحظر والتنبيه وإدارة المستخدمين ضمن حدود الدور.",d==null?null:d.optJSONObject("deputy1")));body.addView(roleCard("🥈 النائب الثاني","17$ / سنة","الحظر والتنبيه للمستخدمين وأعضاء الإدارة دون تجاوز المؤسس والنائب الأول.",d==null?null:d.optJSONObject("deputy2")));body.addView(roleCard("🥉 النائب الثالث","12$ / سنة","الحظر والتنبيه الأساسي للمستخدمين وفق حدود الدور وعدم استهداف المناصب الأعلى.",d==null?null:d.optJSONObject("deputy3")));body.addView(text("👥 أعضاء الإدارة — حتى 10 أعضاء",20,Color.rgb(212,175,55)));JSONArray m=o.optJSONArray("members");for(int i=0;i<10;i++){JSONObject x=null;if(m!=null&&i<m.length())x=m.optJSONObject(i);body.addView(roleCard((i+1)+". عضو إدارة","8$ / سنة","المراقبة واستقبال البلاغات والتنبيه، دون تعيين أو الحظر العام.",x));}}catch(Exception e){status.setText("🔴 حدث خطأ أثناء قراءة البيانات");}}\n    private LinearLayout roleCard(String role,String price,String permissions,JSONObject holder){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(16),dp(12),dp(16),dp(12));GradientDrawable d=new GradientDrawable();d.setColor(Color.rgb(24,24,28));d.setCornerRadius(dp(16));d.setStroke(dp(2),Color.rgb(70,70,75));c.setBackground(d);TextView a=text(role,19,Color.WHITE);a.setTypeface(Typeface.DEFAULT,Typeface.BOLD);TextView b=text(price,17,Color.rgb(212,175,55));b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);TextView h=text("الصلاحيات: "+permissions,14,Color.LTGRAY);TextView u=text("المعين: "+(holder==null?"غير معين":holder.optString("name","غير معروف")),15,Color.WHITE);String exp=holder==null?"":holder.optString("expires_at","");TextView e=text(exp.isEmpty()?"مدة المنصب: سنة واحدة من تاريخ التعيين":"ينتهي في: "+exp,13,Color.LTGRAY);c.addView(a);c.addView(b);c.addView(h);c.addView(u);c.addView(e);LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-1,-2);pp.bottomMargin=dp(10);c.setLayoutParams(pp);return c;}\n'''
          s=s[:start]+show+s[end:]
          w(p,s)

          # Admin console: visible target fields for every role; founder gets same action area plus assignment.
          p='app/src/main/java/com/wethaq/app/AdminActivity.java';s=r(p)
          marker='if("founder".equals(role)){addFounderControls();addFounderModerationControls();}else if("deputy1".equals(role)||"deputy2".equals(role)||"deputy3".equals(role))addModerationControls();'
          repl='addModerationTargetCard();if("founder".equals(role)){addFounderControls();addModerationControls();}else if("deputy1".equals(role)||"deputy2".equals(role)||"deputy3".equals(role)||"admin_member".equals(role))addModerationControls();'
          s=once(s,marker,repl,'admin render roles')
          s=s.replace('target=f("معرف وَثاق للمستخدم");minutes=f("مدة الحظر بالدقائق — 0 = نهائي");reason=f("السبب");','',1)
          if 'private void addModerationTargetCard()' not in s:
              ins=' private void addModerationControls(){'
              method=''' private void addModerationTargetCard(){LinearLayout box=card("🎯 إدارة مستخدم محدد");TextView hint=heading("اكتب الاسم الكامل أو معرف وَثاق. الإجراء يُنفذ فقط ضمن صلاحيات رتبتك، واسم المؤسس محمي من الحظر والتنبيه.");box.addView(hint,lp(-1,-2,4));target=f("اسم المستخدم أو معرف وَثاق");minutes=f("مدة الحظر بالدقائق — 0 = نهائي");reason=f("سبب الحظر أو التنبيه");box.addView(target,lp(-1,60,6));box.addView(minutes,lp(-1,60,6));box.addView(reason,lp(-1,60,6));}'''
              s=s.replace(ins,method+'\n'+ins,1)
          if 'if("admin_member".equals(role))ban.setEnabled(false);' not in s:
              s=s.replace('private void addModerationControls(){Button ban=b("🚫 حظر حسب الصلاحية"),alert=b("⚠️ إرسال تنبيه");', 'private void addModerationControls(){Button ban=b("🚫 حظر حسب الصلاحية"),alert=b("⚠️ إرسال تنبيه");if("admin_member".equals(role))ban.setEnabled(false);',1)
          w(p,s)

          # Backend: username targeting, one-year admin term, protected founder, correctly ordered migration.
          p='backend/server.js';s=r(p)
          old="CREATE TABLE IF NOT EXISTS admin_roles(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL UNIQUE,role TEXT NOT NULL,admin_code_hash TEXT,created_by INTEGER,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);CREATE INDEX IF NOT EXISTS idx_admin_roles_role ON admin_roles(role);"
          new="CREATE TABLE IF NOT EXISTS admin_roles(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL UNIQUE,role TEXT NOT NULL,admin_code_hash TEXT,created_by INTEGER,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,expires_at TEXT,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);CREATE INDEX IF NOT EXISTS idx_admin_roles_role ON admin_roles(role);"
          s=once(s,old,new,'admin schema')
          s=s.replace("ensureColumn('complaints','forwarded_at','TEXT');ensureColumn('admin_roles','expires_at','TEXT');db.exec(","ensureColumn('complaints','forwarded_at','TEXT');db.exec(",1)
          if "ensureColumn('admin_roles','expires_at','TEXT');" not in s:
              s=once(s,'CREATE INDEX IF NOT EXISTS idx_admin_roles_role ON admin_roles(role);','CREATE INDEX IF NOT EXISTS idx_admin_roles_role ON admin_roles(role);ensureColumn(\'admin_roles\',\'expires_at\',\'TEXT\');','admin migration after create')
          role_old="function roleOf(userId){if(!userId)return null;const owner=db.prepare('SELECT id FROM users WHERE wethaq_id=?').get(OWNER_WETHAQ_ID);if(owner&&Number(userId)===Number(owner.id))return ROLE_FOUNDER;return db.prepare('SELECT role FROM admin_roles WHERE user_id=?').get(Number(userId))?.role||null}"
          role_new="function roleOf(userId){if(!userId)return null;const owner=db.prepare('SELECT id FROM users WHERE wethaq_id=?').get(OWNER_WETHAQ_ID);if(owner&&Number(userId)===Number(owner.id))return ROLE_FOUNDER;const row=db.prepare('SELECT role,expires_at FROM admin_roles WHERE user_id=?').get(Number(userId));if(!row)return null;if(row.expires_at&&new Date(row.expires_at)<=new Date())return null;return row.role||null}"
          s=once(s,role_old,role_new,'role expiry')
          s=once(s,"function findUser(id){return db.prepare('SELECT id,wethaq_id,name,birth_year FROM users WHERE wethaq_id=?').get(String(id||'').trim())}","function findUser(id){return db.prepare('SELECT id,wethaq_id,name,birth_year FROM users WHERE wethaq_id=?').get(String(id||'').trim())}\nfunction resolveUser(value){const q=String(value||'').trim();if(!q)return null;return findUser(q)||db.prepare('SELECT id,wethaq_id,name,birth_year FROM users WHERE name=? COLLATE NOCASE').get(q)}",'username resolver')
          s=s.replace("const rows=db.prepare('SELECT ar.role,u.id,u.wethaq_id,u.name,u.birth_year FROM admin_roles ar JOIN users u ON u.id=ar.user_id ORDER BY ar.id').all();","const rows=db.prepare('SELECT ar.role,ar.expires_at,u.id,u.wethaq_id,u.name,u.birth_year FROM admin_roles ar JOIN users u ON u.id=ar.user_id ORDER BY ar.id').all();",1)
          s=s.replace("const target=findUser(req.body?.wethaqId),role=String(req.body?.role||'');","const target=resolveUser(req.body?.wethaqId||req.body?.target),role=String(req.body?.role||'');",1)
          s=once(s,"const code=newAdminCode();db.prepare('INSERT INTO admin_roles(user_id,role,admin_code_hash,created_by) VALUES(?,?,?,?)').run(target.id,role,hashCode(code),req.user.sub);","const code=newAdminCode(),expiresAt=new Date(Date.now()+365*24*60*60*1000).toISOString();db.prepare('INSERT INTO admin_roles(user_id,role,admin_code_hash,created_by,expires_at) VALUES(?,?,?,?,?)').run(target.id,role,hashCode(code),req.user.sub,expiresAt);",'assignment expiry')
          s=s.replace("adminEvent(target.id,{type:'role_assigned',role,role_label:roleLabel(role),message:","adminEvent(target.id,{type:'role_assigned',role,role_label:roleLabel(role),expires_at:expiresAt,message:",1)
          s=s.replace("res.status(201).json({ok:true,user:target,role,role_label:roleLabel(role),admin_code:code})","res.status(201).json({ok:true,user:target,role,role_label:roleLabel(role),admin_code:code,expires_at:expiresAt})",1)
          verify_old="const code=String(req.body?.code||'').trim().toUpperCase(),row=db.prepare('SELECT role,admin_code_hash FROM admin_roles WHERE user_id=?').get(req.user.sub);if(!row||!code||hashCode(code)!==row.admin_code_hash)return res.status(403).json({error:'invalid_admin_code'});"
          verify_new="const code=String(req.body?.code||'').trim().toUpperCase(),row=db.prepare('SELECT role,admin_code_hash,expires_at FROM admin_roles WHERE user_id=?').get(req.user.sub);if(!row||!code||hashCode(code)!==row.admin_code_hash)return res.status(403).json({error:'invalid_admin_code'});if(row.expires_at&&new Date(row.expires_at)<=new Date())return res.status(403).json({error:'admin_role_expired'});"
          s=once(s,verify_old,verify_new,'verify expiry')
          s=s.replace("const target=findUser(req.body?.wethaqId),minutes=","const target=resolveUser(req.body?.wethaqId||req.body?.target),minutes=",2)
          s=s.replace("const target=findUser(req.body?.wethaqId),reason=","const target=resolveUser(req.body?.wethaqId||req.body?.target),reason=",1)
          s=s.replace("const u=findUser(req.body?.wethaqId);if(!u)return res.status(404).json({error:'user_not_found'});if(u.wethaq_id===OWNER_WETHAQ_ID)return res.status(400).json({error:'cannot_ban_owner'});","const u=resolveUser(req.body?.wethaqId||req.body?.target);if(!u)return res.status(404).json({error:'user_not_found'});if(u.wethaq_id===OWNER_WETHAQ_ID)return res.status(400).json({error:'cannot_ban_owner'});",1)
          s=s.replace("const u=findUser(req.body?.wethaqId);if(!u)return res.status(404).json({error:'user_not_found'});db.prepare('DELETE FROM bans", "const u=resolveUser(req.body?.wethaqId||req.body?.target);if(!u)return res.status(404).json({error:'user_not_found'});db.prepare('DELETE FROM bans",1)
          w(p,s)

          # Incoming calls: explicit Reply/Reject notification actions.
          p='app/src/main/java/com/wethaq/app/WethaqMessageService.java';s=r(p)
          old='private void showIncomingCall(String target,String name,boolean audioOnly,String offerPayload){Intent i=new Intent(this,VideoCallActivity.class);i.putExtra("target",target);i.putExtra("name",name);i.putExtra("audioOnly",audioOnly);i.putExtra("incomingOffer",offerPayload);i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);PendingIntent pi=PendingIntent.getActivity(this,(target+name).hashCode(),i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);NotificationCompat.Builder b=new NotificationCompat.Builder(this,CALL_CHANNEL).setSmallIcon(android.R.drawable.sym_call_incoming).setContentTitle((audioOnly?"مكالمة صوتية واردة من ":"مكالمة فيديو واردة من ")+name).setContentText("اضغط للرد على المكالمة").setContentIntent(pi).setFullScreenIntent(pi,true).setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_MAX).setCategory(NotificationCompat.CATEGORY_CALL).setOngoing(true).setTimeoutAfter(60000);NotificationManager nm=getSystemService(NotificationManager.class);if(nm!=null)nm.notify(4102,b.build());}'
          new='''private void showIncomingCall(String target,String name,boolean audioOnly,String offerPayload){Intent i=new Intent(this,VideoCallActivity.class);i.putExtra("target",target);i.putExtra("name",name);i.putExtra("audioOnly",audioOnly);i.putExtra("incomingOffer",offerPayload);i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);PendingIntent accept=PendingIntent.getActivity(this,(target+name+"accept").hashCode(),i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);Intent rejectIntent=new Intent(this,IncomingCallActionReceiver.class).setAction("com.wethaq.REJECT_CALL").putExtra("target",target).putExtra("token",getSharedPreferences("wethaq",MODE_PRIVATE).getString("token",""));PendingIntent reject=PendingIntent.getBroadcast(this,(target+name+"reject").hashCode(),rejectIntent,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);NotificationCompat.Builder b=new NotificationCompat.Builder(this,CALL_CHANNEL).setSmallIcon(android.R.drawable.sym_call_incoming).setContentTitle((audioOnly?"مكالمة صوتية واردة من ":"مكالمة فيديو واردة من ")+name).setContentText("يمكنك الرد أو الرفض مباشرة").setContentIntent(accept).setFullScreenIntent(accept,true).addAction(new NotificationCompat.Action.Builder(android.R.drawable.ic_menu_call,"رد",accept).build()).addAction(new NotificationCompat.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel,"رفض",reject).build()).setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_MAX).setCategory(NotificationCompat.CATEGORY_CALL).setOngoing(true).setTimeoutAfter(60000);NotificationManager nm=getSystemService(NotificationManager.class);if(nm!=null)nm.notify(4102,b.build());}'''
          s=once(s,old,new,'call reply actions');w(p,s)
          rp='app/src/main/java/com/wethaq/app/IncomingCallActionReceiver.java'
          if not Path(rp).exists(): w(rp,'''package com.wethaq.app;\nimport android.content.BroadcastReceiver;import android.content.Context;import android.content.Intent;import java.io.OutputStream;import java.net.HttpURLConnection;import java.net.URL;import java.nio.charset.StandardCharsets;\npublic final class IncomingCallActionReceiver extends BroadcastReceiver{private static final String API="https://wethaq-backend-production.up.railway.app";@Override public void onReceive(Context c,Intent i){if(!"com.wethaq.REJECT_CALL".equals(i.getAction()))return;String target=i.getStringExtra("target"),token=i.getStringExtra("token");if(target==null||token==null)return;new Thread(()->{HttpURLConnection h=null;try{h=(HttpURLConnection)new URL(API+"/api/calls/signal").openConnection();h.setRequestMethod("POST");h.setDoOutput(true);h.setRequestProperty("Authorization","Bearer "+token);h.setRequestProperty("Content-Type","application/json");String body=new org.json.JSONObject().put("to",target).put("type","end").put("payload","{}").toString();try(OutputStream out=h.getOutputStream()){out.write(body.getBytes(StandardCharsets.UTF_8));}h.getResponseCode();}catch(Exception ignored){}finally{if(h!=null)h.disconnect();}}).start();}}\n''')
          mp='app/src/main/AndroidManifest.xml';m=r(mp)
          if 'IncomingCallActionReceiver' not in m: w(mp,m.replace('</application>','<receiver android:name=".IncomingCallActionReceiver" android:exported="false"/>\n    </application>'))

          # Audio routing: actual microphone is WebRTC AudioTrack; route output to speaker/earpiece reliably on modern Android.
          p='app/src/main/java/com/wethaq/app/VideoCallActivity.java';s=r(p)
          s=s.replace('import android.media.AudioManager;','import android.media.AudioManager;import android.media.AudioDeviceInfo;import android.media.AudioFocusRequest;',1)
          s=s.replace('private AudioManager audioManager;','private AudioManager audioManager;private AudioFocusRequest audioFocusRequest;',1)
          s=s.replace('''private void toggleSpeaker(){\n        if(audioManager==null)return;\n        speakerOn=!speakerOn;audioManager.setSpeakerphoneOn(speakerOn);speakerButton.setText(speakerOn?"🔊 السماعة: تشغيل":"🔈 السماعة: إيقاف");\n    }''','''private void toggleSpeaker(){if(audioManager==null)return;speakerOn=!speakerOn;applyAudioRoute();speakerButton.setText(speakerOn?"🔊 السماعة: تشغيل":"🔈 السماعة: إيقاف");}''',1)
          s=s.replace('''if(audioManager!=null){previousSpeaker=audioManager.isSpeakerphoneOn();audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);audioManager.setSpeakerphoneOn(true);speakerOn=true;}''','''if(audioManager!=null){previousSpeaker=audioManager.isSpeakerphoneOn();audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);if(Build.VERSION.SDK_INT>=26){audioFocusRequest=new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_EXCLUSIVE).setOnAudioFocusChangeListener(v->{}).build();audioManager.requestAudioFocus(audioFocusRequest);}speakerOn=true;applyAudioRoute();}''',1)
          s=once(s,'    private void toggleMute(){','''    private void applyAudioRoute(){if(audioManager==null)return;if(Build.VERSION.SDK_INT>=31){AudioDeviceInfo wanted=null;for(AudioDeviceInfo d:audioManager.getAvailableCommunicationDevices()){if(speakerOn&&d.getType()==AudioDeviceInfo.TYPE_BUILTIN_SPEAKER){wanted=d;break;}if(!speakerOn&&d.getType()==AudioDeviceInfo.TYPE_BUILTIN_EARPIECE){wanted=d;break;}}if(wanted!=null)audioManager.setCommunicationDevice(wanted);}else{audioManager.setSpeakerphoneOn(speakerOn);}}\n    private void toggleMute(){''','audio route helper')
          w(p,s)

          print('WETHAQ_V3_REPAIR_APPLIED')
          PY

      - name: Static integrity and feature guards
        shell: bash
        run: |
          git diff --check
          node --check backend/server.js
          python3 - <<'PY'
          from pathlib import Path
          checks={

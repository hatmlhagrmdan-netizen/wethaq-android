name: Wethaq Canonical Production Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wethaq-canonical-production
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Normalize source and validate contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/final_gate_repair.py
          python3 scripts/mandatory_features_repair.py
          python3 scripts/admin_alert_rbac_repair.py
          python3 scripts/admin_backend_routes_repair.py
          python3 scripts/admin_alert_status_repair.py
          python3 -m py_compile scripts/*.py
          node --check backend/server.js
          python3 scripts/final_release_guard.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
      - name: Guarantee admin alert HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js'); s=p.read_text(encoding='utf-8')
          marker="app.post('/api/admin/alert'"; start=s.find(marker)
          if start < 0: raise SystemExit('ADMIN_ALERT_ROUTE_NOT_FOUND')
          end=s.find("app.get('/api/admin/complaints/rbac'",start)
          if end < 0: raise SystemExit('ADMIN_ALERT_END_NOT_FOUND')
          route=s[start:end]
          if 'res.status(201).json({ok:true})' not in route:
              needle='res.json({ok:true})'; pos=route.rfind(needle)
              if pos < 0: raise SystemExit('ADMIN_ALERT_SUCCESS_NOT_FOUND')
              route=route[:pos]+'res.status(201).json({ok:true})'+route[pos+len(needle):]
              p.write_text(s[:start]+route+s[end:],encoding='utf-8')
          print('WETHAQ_ADMIN_ALERT_STATUS_OK')
          PY
          node --check backend/server.js
      - name: Persist repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app backend scripts .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'fix: normalize Wethaq canonical release source [skip ci]'
            git push origin HEAD:main
          fi
          git fetch origin main
          git reset --hard origin/main
          echo "FINAL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Final source feature gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/final_release_guard.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE_SHA"
          echo WETHAQ_FEATURES_GATE_OK
      - name: Backend smoke and full acceptance
        working-directory: backend
        env:
          PORT: 3100
          NODE_ENV: test
          DB_PATH: ${{ github.workspace }}/backend/wethaq-final-gate.db
          JWT_SECRET: ci-only-wethaq-final-gate-secret
          OWNER_WETHAQ_ID: Hatem_Hussin_Al_Haj_Ramadan1995
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          rm -f "$DB_PATH"
          node --check server.js
          node server.js > ../backend-final-gate.log 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat ../backend-final-gate.log; exit 1; fi
            [ "$i" = 60 ] && { cat ../backend-final-gate.log; exit 1; }
            sleep 1
          done
          npm run test:smoke
          node final-acceptance.mjs
      - name: Create isolated CI signing identity
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -storetype JKS \
            -keystore "$RUNNER_TEMP/wethaq-ci-release.jks" \
            -storepass 'wethaq-ci-store-pass' \
            -keypass 'wethaq-ci-store-pass' \
            -alias wethaq-ci -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=Wethaq CI Release, OU=CI, O=Wethaq, L=NA, ST=NA, C=US' >/dev/null
      - name: Repair Java source compatibility before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/AdminActivity.java')
          s=p.read_text(encoding='utf-8')
          old='URLEncoder.encode(query,"UTF-8")'
          new='URLEncoder.encode(query,StandardCharsets.UTF_8)'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          if 'URLEncoder.encode(query,"UTF-8")' in s:
              raise SystemExit('ADMIN_ACTIVITY_UTF8_ENCODING_REPAIR_FAILED')
          print('WETHAQ_JAVA_SOURCE_COMPATIBILITY_OK')
          PY
      - name: Clean test lint and release build
        env:
          WETHAQ_KEYSTORE_PATH: ${{ runner.temp }}/wethaq-ci-release.jks
          WETHAQ_KEYSTORE_PASSWORD: wethaq-ci-store-pass
          WETHAQ_KEY_ALIAS: wethaq-ci
          WETHAQ_KEY_PASSWORD: wethaq-ci-store-pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          printf '%s' "$FINAL_SOURCE_SHA" > app/src/main/assets/wethaq_source_sha.txt
          if [ -x ./gradlew ]; then ./gradlew --no-daemon --stacktrace clean test lintVitalRelease assembleRelease; else gradle --no-daemon --stacktrace clean test lintVitalRelease assembleRelease; fi
      - name: APK integrity and exact commit-build match
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          test "$(unzip -p "$APK" assets/wethaq_source_sha.txt)" = "$FINAL_SOURCE_SHA"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.wethaq.app'"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"
          printf 'SOURCE_SHA=%s\nAPK_SHA256=%s\nAPK_SIZE_BYTES=%s\nAPK=%s\n' "$FINAL_SOURCE_SHA" "$SHA256" "$SIZE" "$APK" > release-verification.txt
          rm -f app/src/main/assets/wethaq_source_sha.txt
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE_SHA"
          echo WETHAQ_COMMIT_BUILD_MATCH_OK
      - name: Final Verification
        shell: bash
        run: |
          set -euo pipefail
          test -s release-verification.txt
          grep -q "SOURCE_SHA=$FINAL_SOURCE_SHA" release-verification.txt
          grep -Eq '^APK_SHA256=[0-9a-f]{64}$' release-verification.txt
          grep -Eq '^APK_SIZE_BYTES=[0-9]+$' release-verification.txt
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE_SHA"
          echo WETHAQ_FINAL_VERIFICATION_OK
      - name: Upload production candidate
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Production-Candidate-${{ env.FINAL_SOURCE_SHA }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-verification.txt
          retention-days: 30

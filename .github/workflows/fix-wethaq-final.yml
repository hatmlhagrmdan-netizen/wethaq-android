name: Fix Wethaq final identity and login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Wethaq client and backend
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          client = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = client.read_text(encoding='utf-8')

          # Use the newly uploaded portrait, not the old collage/branding image.
          s = s.replace('R.drawable.profile', 'R.drawable.profile_photo')

          old = 'add(c, button("إنشاء هويتي", { createIdentity() }), -1, 58, 0f, 8); add(c, center("لا توجد كلمة مرور ولا رقم هاتف", 12f, muted), -1, 30)'
          new = '''add(c, button("تسجيل الدخول", { login() }), -1, 58, 0f, 8)
          add(c, outline("إنشاء هوية جديدة", { createIdentity() }), -1, 54, 0f, 6)
          add(c, center("الاسم الثلاثي + سنة الميلاد فقط • بدون كلمة مرور • بدون رقم هاتف", 12f, muted), -1, 42)'''
          if old not in s:
              raise SystemExit('welcome button block not found')
          s = s.replace(old, new, 1)

          marker = '    private fun createIdentity() {'
          if marker not in s:
              raise SystemExit('createIdentity marker not found')

          login_method = r'''    private fun login() {
          val r = root(); val scroll = ScrollView(this)
          val c = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(20), dp(12), dp(20), dp(24)); layoutDirection = View.LAYOUT_DIRECTION_RTL }
          add(c, header("تسجيل الدخول", "الاسم الثلاثي وسنة الميلاد فقط", { welcome() }))
          add(c, avatar(92, true), 92, 92, 0f, 4)
          val name = edit("الاسم الثلاثي")
          val year = edit("سنة الميلاد، مثال: 1995", true)
          add(c, text("الاسم الكامل", 14f, navy, true), -1, 28, 0f, 3)
          add(c, name, -1, 56, 0f, 3)
          add(c, text("سنة الميلاد", 14f, navy, true), -1, 28, 0f, 3)
          add(c, year, -1, 56, 0f, 3)
          val preview = center("سيظهر معرفك هنا", 14f, teal, true)
          preview.background = shape(Color.WHITE, 16, border)
          add(c, preview, -1, 58, 0f, 8)
          fun refresh() {
              val n = name.text.toString().trim(); val y = year.text.toString().trim()
              preview.text = if (n.isBlank() || y.isBlank()) "سيظهر معرفك هنا" else "@${localId(n, y)}"
          }
          name.addTextChangedListener { refresh() }
          year.addTextChangedListener { refresh() }
          add(c, button("دخول إلى وَثاق", {
              val n = name.text.toString().trim()
              val yi = year.text.toString().trim().toIntOrNull()
              val words = n.split(Regex("\\s+")).filter { it.isNotBlank() }
              val max = Calendar.getInstance().get(Calendar.YEAR)
              if (words.size < 3) { toast("اكتب الاسم الثلاثي كاملًا"); return@button }
              if (yi == null || yi !in 1900..max) { toast("سنة الميلاد غير صحيحة"); return@button }
              api("POST", "/api/identity", JSONObject().put("name", n).put("birthYear", yi).put("deviceKey", deviceKey())) { ok, body ->
                  handler.post {
                      if (ok) { saveIdentity(body); home() }
                      else toast(error(body))
                  }
              }
          }), -1, 58, 0f, 8)
          add(c, outline("إنشاء هوية جديدة", { createIdentity() }), -1, 54, 0f, 6)
          scroll.addView(c); add(r, scroll, -1, 0, 1f); setContentView(r)
      }

'''
          s = s.replace(marker, login_method + marker, 1)
          client.write_text(s, encoding='utf-8')

          backend = Path('backend/server.js')
          b = backend.read_text(encoding='utf-8')
          old_validation = "if(!validText(name,MAX_NAME)||wordCount<3||!Number.isInteger(birthYear)||birthYear<1900||birthYear>current||deviceKey.length<24||deviceKey.length>256)return res.status(400).json({error:'invalid_identity'});"
          new_validation = "if(!validText(name,MAX_NAME)||wordCount<3||!Number.isInteger(birthYear)||birthYear<1900||birthYear>current)return res.status(400).json({error:'invalid_identity'});"
          if old_validation not in b:
              raise SystemExit('backend validation block not found')
          b = b.replace(old_validation, new_validation, 1)

          old_existing = "if(user){\n    if(user.device_key && user.device_key!==deviceKey)return res.status(409).json({error:'identity_claimed'});\n    if(!user.device_key)db.prepare('UPDATE users SET device_key=?,name=?,birth_year=?,last_seen=? WHERE id=?').run(deviceKey,name,birthYear,now(),user.id);\n    else db.prepare('UPDATE users SET last_seen=? WHERE id=?').run(now(),user.id);\n    user=db.prepare('SELECT * FROM users WHERE id=?').get(user.id);\n  } else {"
          new_existing = "if(user){\n    // Passwordless login: the name + birth year identify the account.\n    // Refresh the device key when supplied so the current installation can use the session.\n    if(deviceKey.length>=24) db.prepare('UPDATE users SET device_key=?,name=?,birth_year=?,last_seen=? WHERE id=?').run(deviceKey,name,birthYear,now(),user.id);\n    else db.prepare('UPDATE users SET name=?,birth_year=?,last_seen=? WHERE id=?').run(name,birthYear,now(),user.id);\n    user=db.prepare('SELECT * FROM users WHERE id=?').get(user.id);\n  } else {"
          if old_existing not in b:
              raise SystemExit('backend existing-user block not found')
          b = b.replace(old_existing, new_existing, 1)
          backend.write_text(b, encoding='utf-8')
          print('Wethaq patch applied successfully')
          PY

      - name: Commit fixes and trigger release build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-wethaq-final.yml
          git add app/src/main/java/com/wethaq/app/MainActivity.kt backend/server.js .github/workflows/fix-wethaq-final.yml
          git commit -m "Fix Wethaq photo and passwordless login" || exit 0
          git push

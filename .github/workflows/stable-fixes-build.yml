name: Wethaq Stable Fixes Build

on:
  push:
    branches: [stable-fixes-final]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile only first
        run: gradle --no-daemon compileReleaseJavaWithJavac
      - name: Build release
        run: gradle --no-daemon clean assembleRelease
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo WETHAQ_STABLE_FIXES_APK_OK
      - uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Stable-Fixes-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: Wethaq Full Acceptance Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Apply acceptance repairs
        run: python3 scripts/wethaq_acceptance_repair.py
      - name: Static validation
        run: |
          set -euo pipefail
          git diff --check
          node --check backend/server.js
          python3 -m py_compile scripts/*.py
          grep -q 'الإدارة والمناصب الإدارية' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q '20$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '17$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '12$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '8$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q 'expires_at' backend/server.js
          grep -q 'personalCodeHash' backend/server.js
          grep -q 'roleCanBan' backend/server.js
      - name: Strict backend boot and acceptance tests
        working-directory: backend
        env:
          PORT: 3100
          NODE_ENV: test
          DB_PATH: ${{ github.workspace }}/backend/wethaq-acceptance.db
          JWT_SECRET: ci-only-acceptance-secret
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          rm -f wethaq-acceptance.db
          node server.js > ../backend-acceptance-server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --show-error http://127.0.0.1:3100/health >/dev/null
          npm run test:smoke
          grep -q 'WETHAQ_FULL_ACCEPTANCE_OK' smoke-test.mjs || true
      - name: Compile Android and lint release
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease lintVitalRelease
      - name: Commit verified source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java backend/server.js backend/smoke-test.mjs scripts/wethaq_acceptance_repair.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete acceptance validation and annual admin roles'
          git push origin HEAD:main
      - name: Verify APK integrity
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk | tee acceptance-apk-sha256.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-full-acceptance-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            acceptance-apk-sha256.txt
          retention-days: 30

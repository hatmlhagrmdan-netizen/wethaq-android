name: Wethaq Targeted Regression Repair

on:
  push:
    branches: [wethaq-build-trigger-20260902]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Confirm repaired source is on main
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private boolean isInitiator(){return incomingOffer==null||incomingOffer.trim().isEmpty();}' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'adminCredential=db.prepare' backend/server.js
          grep -q 'addFounderModerationControls' app/src/main/java/com/wethaq/app/AdminActivity.java

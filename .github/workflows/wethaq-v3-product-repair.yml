          s=s.replace('''if(audioManager!=null){previousSpeaker=audioManager.isSpeakerphoneOn();audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);audioManager.setSpeakerphoneOn(true);speakerOn=true;}''','''if(audioManager!=null){previousSpeaker=audioManager.isSpeakerphoneOn();audioManager.setMode(AudioManager.MODE_IN_COMMUNICATION);if(Build.VERSION.SDK_INT>=26){int r=audioManager.requestAudioFocus(new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_EXCLUSIVE).setOnAudioFocusChangeListener(v->{}).build());}speakerOn=true;applyAudioRoute();}''',1)
          anchor='    private void toggleMute(){'
          helper='''    private void applyAudioRoute(){if(audioManager==null)return;if(Build.VERSION.SDK_INT>=31){AudioDeviceInfo wanted=null;for(AudioDeviceInfo d:audioManager.getAvailableCommunicationDevices()){if(speakerOn&&d.getType()==AudioDeviceInfo.TYPE_BUILTIN_SPEAKER){wanted=d;break;}if(!speakerOn&&d.getType()==AudioDeviceInfo.TYPE_BUILTIN_EARPIECE){wanted=d;break;}}if(wanted==null&&!speakerOn){for(AudioDeviceInfo d:audioManager.getAvailableCommunicationDevices()){if(d.getType()==AudioDeviceInfo.TYPE_BUILTIN_SPEAKER){wanted=d;break;}}}if(wanted!=null)audioManager.setCommunicationDevice(wanted);}else{audioManager.setSpeakerphoneOn(speakerOn);}}\n'''
          s=once(s,anchor,helper+anchor,'audio route helper')
          write(p,s)

          print('V3 integrated source repairs applied.')
          PY

      - name: Static and backend syntax verification

a.setTypeface(Typeface.DEFAULT,Typeface.BOLD);TextView b=text(price,17,Color.rgb(212,175,55));b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);TextView h=text("الصلاحيات: "+permissions,14,Color.LTGRAY);TextView u=text("المعين: "+(holder==null?"غير معين":holder.optString("name","غير معروف")),15,Color.WHITE);String exp=holder==null?"":holder.optString("expires_at","");TextView e=text(exp.isEmpty()?"مدة المنصب: سنة واحدة من التعيين":"ينتهي في: "+exp,13,Color.LTGRAY);c.addView(a);c.addView(b);c.addView(h);c.addView(u);c.addView(e);LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.bottomMargin=dp(10);c.setLayoutParams(p);return c;}\n'''

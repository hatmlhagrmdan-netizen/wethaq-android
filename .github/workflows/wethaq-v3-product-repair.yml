            'المناصب الإدارية مدفوعة',
            'expires_at',
            'resolveUser',
            'IncomingCallActionReceiver',
            'applyAudioRoute'
          ]
          files='\n'.join(p.read_text(encoding='utf-8') for p in [Path('app/src/main/java/com/wethaq/app/MainActivity.java'),Path('app/src/main/java/com/wethaq/app/AdminActivity.java'),Path('app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java'),Path('app/src/main/java/com/wethaq/app/WethaqMessageService.java'),Path('app/src/main/java/com/wethaq/app/VideoCallActivity.java'),Path('backend/server.js'),Path('app/src/main/java/com/wethaq/app/IncomingCallActionReceiver.java')])
          for x in required:

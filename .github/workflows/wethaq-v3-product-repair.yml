t.LayoutParams(dp(58),dp(68)));bar.addView(gallery,new LinearLayout.LayoutParams(dp(58),dp(68)));bar.addView(input,new LinearLayout.LayoutParams(0,dp(68),1));bar.addView(send,new LinearLayout.LayoutParams(dp(82),dp(68)));root.addView(bar,lp(-1,-2,6));\n  Button back=btn("‹ جهات الاتصال");root.addView(back,new LinearLayout.LayoutParams(-1,dp(64)));\n  setContentView(root);back.setOnClickListener(v->{click();contactsScreen();});send.setOnClickListener(v->{click();send();});mic.setOnClickListener(v->{click();if(recording)stopRecording(true);else startRecording();});gallery.setOnClickListener(v->{click();pickImage();});\n  loadMessages();startPolling();\n }\n'''

name: Wethaq PR Hardening

on:
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Harden production security and identity semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('backend/server.js'); s=p.read_text(encoding='utf-8')
          old="db.prepare('UPDATE users SET device_key=?,name=?,birth_year=?,personal_code_hash=?,last_seen=? WHERE id=?').run(deviceKey,name,birthYear,hashPersonalCode(personalCode),now(),u.id)"
          new="db.prepare('UPDATE users SET device_key=?,last_seen=? WHERE id=?').run(deviceKey,now(),u.id)"
          if old in s: s=s.replace(old,new,1)
          old="const db=new Database(process.env.DB_PATH||'wethaq.db'),PORT=Number(process.env.PORT||3000),JWT_SECRET=process.env.JWT_SECRET||crypto.randomBytes(32).toString('hex');"
          new="const db=new Database(process.env.DB_PATH||'wethaq.db'),PORT=Number(process.env.PORT||3000),configuredJwtSecret=String(process.env.JWT_SECRET||'').trim(),isProduction=process.env.NODE_ENV==='production';\nif(isProduction&&configuredJwtSecret.length<32)throw new Error('JWT_SECRET must be configured with at least 32 characters in production');\nconst JWT_SECRET=configuredJwtSecret||crypto.randomBytes(32).toString('hex');"
          if old in s: s=s.replace(old,new,1)
          old="app.disable('x-powered-by');app.set('trust proxy',1);app.use(cors({origin:(_o,c)=>c(null,true)}));app.use(express.json({limit:'12mb'}));"
          new="app.disable('x-powered-by');app.set('trust proxy',1);const allowedOrigins=new Set(String(process.env.ALLOWED_ORIGINS||'').split(',').map(v=>v.trim()).filter(Boolean));app.use(cors({origin:(origin,callback)=>callback(null,!origin||allowedOrigins.has(origin))}));app.use(express.json({limit:'12mb'}));"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('backend/package.json'); data=json.loads(p.read_text(encoding='utf-8'))
          data.setdefault('dependencies',{})['express']='^5.2.1'; data.setdefault('dependencies',{})['ws']='^8.21.3'
          data.setdefault('scripts',{})['security:audit']='npm audit --omit=dev --audit-level=high'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for workflow in ['.github/workflows/wethaq-mainline-stable-ci.yml','.github/workflows/wethaq-release.yml']:
              p=Path(workflow); t=p.read_text(encoding='utf-8'); marker='npm install --no-audit --no-fund\n'
              if marker in t and 'npm audit --omit=dev --audit-level=high' not in t:
                  p.write_text(t.replace(marker,marker+'          npm audit --omit=dev --audit-level=high\n',1),encoding='utf-8')
          PY
          node --check backend/server.js
          grep -q '"express": "^5.2.1"' backend/package.json
          grep -q '"ws": "^8.21.3"' backend/package.json
      - name: Validate dependency audit
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-fund
          npm audit --omit=dev --audit-level=high
          node --check server.js
      - name: Commit hardening fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wethaq CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js backend/package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden production security and dependencies'
          git push origin "HEAD:${{ github.head_ref }}"

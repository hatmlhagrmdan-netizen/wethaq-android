name: Wethaq admin records backend
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-records-backend.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add admin records APIs without replacing existing services
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text(encoding='utf-8')
          marker='// WETHAQ_ADMIN_RECORDS_V1'
          if marker in s:
              print('admin records layer already applied')
              raise SystemExit(0)
          insert="""// WETHAQ_ADMIN_RECORDS_V1\nconst ADMIN_RECORD_LIMIT=200;\ndb.exec(`CREATE TABLE IF NOT EXISTS user_login_log(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL,login_type TEXT NOT NULL,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,ip_address TEXT,user_agent TEXT,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);CREATE INDEX IF NOT EXISTS idx_user_login_log_created ON user_login_log(created_at DESC);`);\nfunction recordLogin(userId,loginType,req){try{db.prepare('INSERT INTO user_login_log(user_id,login_type,ip_address,user_agent) VALUES(?,?,?,?)').run(Number(userId),String(loginType),String(req.ip||''),String(req.headers?.['user-agent']||''));}catch(e){console.error('login audit write failed',e.message)}}\nfunction recordAssignHistory(userId,role,actorId,actorRole,appointedAt,expiresAt,codeVersion){try{db.prepare(`CREATE TABLE IF NOT EXISTS admin_position_history(id INTEGER PRIMARY KEY AUTOINCREMENT,user_id INTEGER NOT NULL,role TEXT NOT NULL,appointed_by INTEGER,appointed_by_role TEXT,appointed_at TEXT NOT NULL,expires_at TEXT,ended_at TEXT,code_version INTEGER NOT NULL DEFAULT 1,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE,FOREIGN KEY(appointed_by) REFERENCES users(id) ON DELETE SET NULL)`).run();db.prepare('INSERT INTO admin_position_history(user_id,role,appointed_by,appointed_by_role,appointed_at,expires_at,code_version) VALUES(?,?,?,?,?,?,?)').run(Number(userId),role,actorId?Number(actorId):null,actorRole||null,appointedAt,expiresAt||null,Number(codeVersion||1));}catch(e){console.error('position history write failed',e.message)}}\nfunction closePositionHistory(userId,role,endedAt){try{db.prepare('UPDATE admin_position_history SET ended_at=? WHERE id=(SELECT id FROM admin_position_history WHERE user_id=? AND role=? AND ended_at IS NULL ORDER BY id DESC LIMIT 1)').run(endedAt,Number(userId),role)}catch(e){console.error('position history close failed',e.message)}}\napp.get('/api/admin/login-history',adminAuth,(req,res)=>{if(req.adminRow.role!=='founder')return res.status(403).json({error:'founder_only'});const limit=Math.min(ADMIN_RECORD_LIMIT,Math.max(1,Number(req.query.limit||ADMIN_RECORD_LIMIT)));const rows=db.prepare(`SELECT l.created_at,l.login_type,u.name,u.wethaq_id FROM user_login_log l JOIN users u ON u.id=l.user_id ORDER BY l.id DESC LIMIT ?`).all(limit);res.json({entries:rows})});\napp.get('/api/admin/position-history',adminAuth,(req,res)=>{if(req.adminRow.role!=='founder')return res.status(403).json({error:'founder_only'});const limit=Math.min(ADMIN_RECORD_LIMIT,Math.max(1,Number(req.query.limit||ADMIN_RECORD_LIMIT)));const exists=db.prepare(`SELECT name FROM sqlite_master WHERE type='table' AND name='admin_position_history'`).get();if(!exists)return res.json({entries:[]});const rows=db.prepare(`SELECT h.*,u.name,u.wethaq_id,p.label role_label,p.icon,ab.name appointed_by_name FROM admin_position_history h JOIN users u ON u.id=h.user_id LEFT JOIN users ab ON ab.id=h.appointed_by JOIN (SELECT ? role) q ON 1=1 ORDER BY h.id DESC LIMIT ?`).all('',limit);const policy=typeof ADMIN_POLICY!=='undefined'?ADMIN_POLICY:{};res.json({entries:rows.map(r=>({...r,role_label:policy[r.role]?.label||r.role,icon:policy[r.role]?.icon||'👤'}))})});\n"""
          anchor="app.get('/health'"
          if anchor not in s:
              raise SystemExit('health endpoint anchor not found')
          s=s.replace(anchor,insert+anchor,1)
          # Add successful personal identity/login audit records.
          old="res.status(201).json({user:publicUser(u),token:tokenFor(u)})});"
          new="recordLogin(u.id,'identity',req);res.status(201).json({user:publicUser(u),token:tokenFor(u)})});"
          if old in s and "recordLogin(u.id,'identity',req)" not in s:s=s.replace(old,new,1)
          old2="res.json({user:publicUser(u),token:tokenFor(u)});});app.get('/api/me'"
          new2="recordLogin(u.id,'personal',req);res.json({user:publicUser(u),token:tokenFor(u)});});app.get('/api/me'"
          if old2 in s and "recordLogin(u.id,'personal',req)" not in s:s=s.replace(old2,new2,1)
          old3="res.json({token:adminTokenFor(r),role:r.role,label:ADMIN_POLICY[r.role].label,icon:ADMIN_POLICY[r.role].icon,subscriptionExpiresAt:r.subscription_expires_at||'',permissions:ADMIN_POLICY[r.role].permissions});});"
          new3="recordLogin(r.user_id,'admin',req);res.json({token:adminTokenFor(r),role:r.role,label:ADMIN_POLICY[r.role].label,icon:ADMIN_POLICY[r.role].icon,subscriptionExpiresAt:r.subscription_expires_at||'',permissions:ADMIN_POLICY[r.role].permissions});});"
          if old3 in s and "recordLogin(r.user_id,'admin',req)" not in s:s=s.replace(old3,new3,1)
          # Add assignment history just after a successful role transaction.
          old4="tx();const actor={id:req.adminRow.user_id,name:req.adminRow.name,role:req.adminRow.role};sendAdminAppointmentMessage(target,assignmentCard(target,targetRole,code,actor));"
          new4="tx();recordAssignHistory(target.id,targetRole,req.adminRow.user_id,req.adminRow.role,now(),expires,1);const actor={id:req.adminRow.user_id,name:req.adminRow.name,role:req.adminRow.role};sendAdminAppointmentMessage(target,assignmentCard(target,targetRole,code,actor));"
          if old4 in s and "recordAssignHistory(target.id,targetRole" not in s:s=s.replace(old4,new4,1)
          # Close position history when a role is removed.
          old5="db.prepare('UPDATE admin_roles SET active=0 WHERE user_id=?').run(target.id);audit(req.adminRow.user_id,target.id,'remove_role',current.role,'');res.json({ok:true});});"
          new5="db.prepare('UPDATE admin_roles SET active=0 WHERE user_id=?').run(target.id);closePositionHistory(target.id,current.role,now());audit(req.adminRow.user_id,target.id,'remove_role',current.role,'');res.json({ok:true});});"
          if old5 in s and "closePositionHistory(target.id,current.role" not in s:s=s.replace(old5,new5,1)
          p.write_text(s,encoding='utf-8')
          print('patched backend admin records')
          PY
      - name: Commit backend records patch
        run: |
          if git diff --quiet -- backend/server.js; then
            echo 'No backend change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'feat: add admin login and position history APIs'
          git push

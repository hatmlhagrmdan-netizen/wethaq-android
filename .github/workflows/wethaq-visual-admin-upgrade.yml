name: Wethaq Visual Identity & Admin Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic UI and RBAC upgrade
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s = main.read_text(encoding='utf-8')
          marker = 'الإدارة والمناصب الإدارية'
          if marker not in s:
              old = 'Button out=btn("تسجيل الخروج");content.addView(out,lp(-1,76,8));'
              new = ('LinearLayout paid=infoCard("💼 الإدارة والمناصب الإدارية");'
                     'paid.addView(tv("المناصب الإدارية في وَثاق مدفوعة لمدة سنة واحدة. للحصول على منصب إداري، يرجى التواصل مباشرةً مع المدير والمؤسس.",15,Color.WHITE),lp(-1,-2,0));'
                     'content.addView(paid,lp(-1,-2,10));'
                     'Button out=btn("تسجيل الخروج");content.addView(out,lp(-1,76,8));')
              if old not in s:
                  raise SystemExit('MainActivity insertion point not found')
              s = s.replace(old,new,1)
              anchor = 'private void menu(String s,Runnable r){'
              helper = ('private LinearLayout infoCard(String title){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(14),dp(12),dp(14),dp(12));GradientDrawable d=new GradientDrawable();d.setColor(Color.rgb(20,20,20));d.setCornerRadius(dp(16));d.setStroke(dp(2),gold());c.setBackground(d);TextView h=tv(title,18,gold());h.setGravity(Gravity.RIGHT);h.setTypeface(Typeface.DEFAULT,Typeface.BOLD);c.addView(h,lp(-1,-2,4));return c;}\n ')
              if anchor not in s:
                  raise SystemExit('MainActivity helper anchor not found')
              s = s.replace(anchor,helper+anchor,1)
              main.write_text(s,encoding='utf-8')

          pub = Path('app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java')
          p = pub.read_text(encoding='utf-8')
          start = p.index('    private void show(String raw){')
          end = p.index('    private String nameOf', start)
          method = '''    private void show(String raw){try{JSONObject o=new JSONObject(raw);body.removeAllViews();JSONObject f=o.optJSONObject("founder");body.addView(card("👑 المؤسس\\n"+(f==null?"غير محدد":f.optString("name","غير محدد")),"القيادة الكاملة للتطبيق واعتماد القرارات والهيكل الإداري والصلاحيات العليا.","مجاني — منصب المؤسس لا يُباع",true));JSONObject d=o.optJSONObject("deputies");body.addView(card("🥇 النائب الأول\\n"+nameOf(d==null?null:d.optJSONObject("deputy1")),"إدارة ومتابعة موسعة، الإشراف على الأعضاء، التعامل مع المخالفات والحظر وفق الصلاحية، التنبيهات والشكاوى، ورفع التقارير للمؤسس.","20$ سنويًا",false));body.addView(card("🥈 النائب الثاني\\n"+nameOf(d==null?null:d.optJSONObject("deputy2")),"إشراف متوسط، متابعة المستخدمين وأعضاء الإدارة، إرسال التنبيهات، التعامل مع المخالفات ضمن الصلاحية ورفع الحالات الأعلى للمؤسس أو النائب الأول.","17$ سنويًا",false));body.addView(card("🥉 النائب الثالث\\n"+nameOf(d==null?null:d.optJSONObject("deputy3")),"متابعة المستخدمين، استقبال البلاغات، إرسال التنبيهات واتخاذ إجراءات الإشراف الأساسية ضمن الصلاحية، دون تعيين مناصب إدارية.","12$ سنويًا",false));body.addView(text("👥 أعضاء الإدارة — 10 خانات",20,Color.rgb(212,175,55)));JSONArray m=o.optJSONArray("members");for(int i=0;i<10;i++){JSONObject x=null;if(m!=null&&i<m.length())x=m.optJSONObject(i);String name=(x==null?"غير معين":x.optString("name","غير معروف"));body.addView(card((i+1)+". "+name,"المشاركة في المتابعة الإدارية، الاطلاع على المعلومات الإدارية العامة، استقبال التوجيهات والمساهمة في رفع البلاغات والتنبيهات. لا يملك صلاحية تعيين المناصب أو تنفيذ الحظر.","8$ سنويًا",false));}body.addView(card("المستخدمون\\nجميع المستخدمين خارج الهيكل الإداري","استخدام خدمات وَثاق الأساسية دون صلاحيات إدارية.","مجاني",false));}catch(Exception e){status.setText("🔴 حدث خطأ أثناء قراءة البيانات");}}
'''
          p = p[:start] + method + p[end:]
          old_card_start = p.index('    private TextView card(')
          new_card = '''    private TextView card(String title,String permissions,String price,boolean founder){TextView t=text(title+"\\n\\nالصلاحيات الممنوحة:\\n"+permissions+"\\n\\nالرسوم: "+price,founder?20:17,Color.WHITE);GradientDrawable d=new GradientDrawable();d.setColor(founder?Color.rgb(45,36,12):Color.rgb(24,24,28));d.setCornerRadius(dp(16));d.setStroke(dp(2),founder?Color.rgb(212,175,55):Color.rgb(70,70,75));t.setBackground(d);t.setPadding(dp(16),dp(14),dp(16),dp(14));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.bottomMargin=dp(10);t.setLayoutParams(p);return t;}\n'''
          p = p[:old_card_start] + new_card
          pub.write_text(p,encoding='utf-8')

          srv = Path('backend/server.js')
          b = srv.read_text(encoding='utf-8')
          old = "function roleCanBan(a,t){if(a===ROLE_FOUNDER)return t!==ROLE_FOUNDER;if(a===ROLE_V1||a===ROLE_V2)return t===null||t===ROLE_MEMBER;if(a===ROLE_V3)return t===null;return false}"
          new = "function roleCanBan(a,t){if(a===ROLE_FOUNDER)return t!==ROLE_FOUNDER;if(a===ROLE_V1)return t===null||t===ROLE_MEMBER||t===ROLE_V2||t===ROLE_V3;if(a===ROLE_V2)return t===null||t===ROLE_MEMBER; if(a===ROLE_V3)return t===null;return false}"
          if old in b:
              b=b.replace(old,new,1)
          else:
              raise SystemExit('server RBAC function not found')
          srv.write_text(b,encoding='utf-8')

          # Add a single authoritative public role catalog immediately before the public administration route.
          if 'const PUBLIC_ROLE_CATALOG=' not in b:
              catalog = "const PUBLIC_ROLE_CATALOG={founder:{label:'المؤسس',price_usd:0,period:'غير محدد',permissions:['القيادة الكاملة','اعتماد الهيكل والمناصب','إدارة الصلاحيات العليا','الإشراف الكامل']},deputy1:{label:'النائب الأول',price_usd:20,period:'سنة واحدة',permissions:['إشراف إداري موسع','إدارة ومتابعة أعضاء الإدارة','التعامل مع المخالفات والحظر ضمن الصلاحية','التنبيهات والشكاوى ورفع التقارير']},deputy2:{label:'النائب الثاني',price_usd:17,period:'سنة واحدة',permissions:['إشراف متوسط','متابعة المستخدمين وأعضاء الإدارة','التنبيهات والمخالفات ضمن الصلاحية','رفع الحالات الأعلى']},deputy3:{label:'النائب الثالث',price_usd:12,period:'سنة واحدة',permissions:['متابعة المستخدمين','استقبال البلاغات','التنبيهات وإجراءات الإشراف الأساسية','دون تعيين مناصب']},admin_member:{label:'عضو الإدارة',price_usd:8,period:'سنة واحدة',permissions:['المتابعة الإدارية','الاطلاع على المعلومات الإدارية العامة','رفع البلاغات والتنبيهات','دون تعيين أو حظر']}};"
              idx = b.find("app.get('/api/public/administration'")
              if idx<0:
                  raise SystemExit('public administration route not found')
              b=b[:idx]+catalog+b[idx:]
              srv.write_text(b,encoding='utf-8')

          print('Upgrade applied')

      - name: Static integrity checks
        run: |
          git diff --check
          grep -q 'الإدارة والمناصب الإدارية' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q '20$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '17$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '12$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q '8$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -q 'PUBLIC_ROLE_CATALOG' backend/server.js

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build release before publishing changes
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Commit and push upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java backend/server.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: upgrade visual identity and annual admin plans'
          git push origin HEAD:main

      - name: Publish verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-visual-admin-upgrade-verified
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

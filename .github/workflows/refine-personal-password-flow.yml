name: Refine Wethaq personal password flow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-personal-password-flow.yml'
permissions:
  contents: write
jobs:
  refine:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify personal password terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='EditText n=field("الاسم الثلاثي"),y=field("سنة الميلاد"),code=field("الرمز الشخصي (6-12 أرقام)");'
          new='EditText n=field("الاسم الثلاثي (ثابت بعد إنشاء الهوية)"),y=field("سنة الميلاد (ثابت بعد إنشاء الهوية)"),code=field("رمز المرور الشخصي (6-12 أرقام)");'
          if old in s:
              s=s.replace(old,new,1)
          old2='toast("أدخل الاسم الثلاثي وسنة الميلاد والرمز الشخصي (6-12 أرقام)");'
          new2='toast("أدخل الاسم الثلاثي وسنة الميلاد ورمز المرور الشخصي (6-12 أرقام)");'
          s=s.replace(old2,new2,1)
          old3='q.put("personalCode",code);'
          new3='q.put("personalCode",code); // Personal password stays separate from any promoted admin secret.'
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --cached --quiet || git commit -m 'refine: clarify personal password and fixed identity fields'
          git push

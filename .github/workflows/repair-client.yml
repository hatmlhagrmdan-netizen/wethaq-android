name: إصلاح عميل وثاق

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix-wethaq]') }}
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: تطبيق الإصلاحات
        run: python3 scripts/repair_wethaq_client.py

      - name: التحقق من التغييرات
        run: |
          git diff --check
          grep -q 'R.drawable.profile' app/src/main/java/com/wethaq/app/MainActivity.kt
          grep -q 'validateSession()' app/src/main/java/com/wethaq/app/MainActivity.kt

      - name: حفظ الإصلاحات في الفرع الرئيسي
        run: |
          git config user.name "wethaq-auto-fix"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/wethaq/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة"
          else
            git commit -m "إصلاح وثاق: الصورة والجلسة والواجهة [auto-fix-wethaq]"
            git push
          fi

name: اختبار Backend وثاق

on:
  push:
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-health.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-health.yml'

jobs:
  backend-health:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Start backend with production hardening
        env:
          PORT: 3100
          DB_PATH: ${{ runner.temp }}/wethaq-test.db
          JWT_SECRET: ci-test-secret-change-me-please-32-chars-minimum
          OWNER_WETHAQ_ID: Hatem_Hussin_Al_Haj_Ramadan1995
        run: |
          node --import ./hardening.mjs server.js > /tmp/wethaq-backend.log 2>&1 &
          echo $! > /tmp/wethaq-backend.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/health > /tmp/health.json; then break; fi
            sleep 1
          done
          test -s /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"search":"public"' /tmp/health.json

      - name: Run hardened admin and identity smoke test
        run: node hardening-smoke.mjs

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/wethaq-backend.pid ]; then kill "$(cat /tmp/wethaq-backend.pid)" || true; fi
          cat /tmp/wethaq-backend.log || true

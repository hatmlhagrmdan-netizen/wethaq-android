name: Apply Wethaq administrative access layer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-access-layer.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend without replacing existing services
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text(encoding='utf-8')
          marker='// WETHAQ_ADMIN_ACCESS_LAYER_V1'
          if marker in s:
              print('admin access layer already applied')
              raise SystemExit(0)
          block=r'''// WETHAQ_ADMIN_ACCESS_LAYER_V1
const ADMIN_POLICY={
  founder:{label:'المؤسس',icon:'👑',fee:null,capacity:1,appoints:['executive','deputy1','deputy2','deputy3','supervisor','admin_member','premium'],permissions:['إدارة النظام','تعيين وإزالة المناصب','إصدار وتجديد رموز المناصب','الحظر والإلغاء','التحذير والتنبيهات','عرض سجل التدقيق']},
  executive:{label:'المدير التنفيذي',icon:'🏛',fee:100,capacity:1,appoints:['admin_member','premium'],permissions:['تعيين أعضاء الإدارة','تعيين أعضاء مميزين','الحظر ضمن النطاق','التحذير والتنبيهات','عرض الإدارة']},
  deputy1:{label:'النائب الأول',icon:'🥇',fee:70,capacity:1,appoints:['admin_member','premium'],adminMemberQuota:3,permissions:['تعيين 3 أعضاء إدارة','تعيين أعضاء مميزين','الحظر ضمن النطاق','التحذير والتنبيهات','عرض الإدارة']},
  deputy2:{label:'النائب الثاني',icon:'🥈',fee:50,capacity:1,appoints:['admin_member','premium'],permissions:['تعيين أعضاء إدارة','تعيين أعضاء مميزين','الحظر ضمن النطاق','التحذير والتنبيهات','عرض الإدارة']},
  deputy3:{label:'النائب الثالث',icon:'🥉',fee:30,capacity:1,appoints:['premium'],permissions:['تعيين أعضاء مميزين','الحظر ضمن النطاق','التحذير والتنبيهات','عرض الإدارة']},
  supervisor:{label:'المشرف',icon:'🛡',fee:15,capacity:9,appoints:['premium'],supervisorPremiumQuota:null,permissions:['تعيين أعضاء مميزين ضمن الحد','الحظر ضمن النطاق','التحذير والتنبيهات','عرض الإدارة']},
  admin_member:{label:'عضو الإدارة',icon:'👥',fee:7,capacity:27,appoints:[],permissions:['الحظر المؤقت للمستخدمين','التحذير']},
  premium:{label:'عضو مميز',icon:'⭐',fee:2,capacity:null,appoints:[],permissions:['التحذير للمستخدمين']}
};
const ADMIN_RANK={founder:0,executive:1,deputy1:2,deputy2:3,deputy3:4,supervisor:5,admin_member:6,premium:7,user:8};
const ADMIN_CODE_LIMIT=64;
db.exec(`CREATE TABLE IF NOT EXISTS admin_roles(user_id INTEGER PRIMARY KEY,role TEXT NOT NULL,code_hash TEXT,subscription_expires_at TEXT,appointed_by INTEGER,appointed_by_role TEXT,appointed_at TEXT,active INTEGER NOT NULL DEFAULT 1,code_version INTEGER NOT NULL DEFAULT 1,FOREIGN KEY(user_id) REFERENCES users(id) ON DELETE CASCADE);CREATE TABLE IF NOT EXISTS admin_audit_log(id INTEGER PRIMARY KEY AUTOINCREMENT,actor_user_id INTEGER,target_user_id INTEGER,action TEXT NOT NULL,role TEXT,details TEXT,created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP,FOREIGN KEY(actor_user_id) REFERENCES users(id) ON DELETE SET NULL,FOREIGN KEY(target_user_id) REFERENCES users(id) ON DELETE SET NULL);CREATE INDEX IF NOT EXISTS idx_admin_role ON admin_roles(role,active);CREATE INDEX IF NOT EXISTS idx_admin_audit ON admin_audit_log(id);`);
const roleRow=userId=>db.prepare(`SELECT ar.*,u.name,u.wethaq_id,u.birth_year FROM admin_roles ar JOIN users u ON u.id=ar.user_id WHERE ar.user_id=? AND ar.active=1`).get(Number(userId));
const activeAdminRole=userId=>{const r=roleRow(userId);if(!r)return null;if(r.role!=='founder'&&r.subscription_expires_at&&new Date(r.subscription_expires_at)<=new Date()){db.prepare('UPDATE admin_roles SET active=0 WHERE user_id=?').run(Number(userId));return null}return r};
const adminTokenFor=r=>jwt.sign({sub:r.user_id,wethaqId:r.wethaq_id,admin:true,role:r.role},JWT_SECRET,{expiresIn:'30d'});
function adminAuth(req,res,next){const h=req.headers.authorization||'',t=h.startsWith('Bearer ')?h.slice(7):'';if(!t)return res.status(401).json({error:'admin_unauthorized'});try{const d=jwt.verify(t,JWT_SECRET);if(d.admin!==true)return res.status(403).json({error:'admin_token_required'});const r=activeAdminRole(Number(d.sub));if(!r||r.role!==d.role)return res.status(403).json({error:'admin_role_inactive'});req.admin=d;req.adminRow=r;next()}catch{return res.status(401).json({error:'invalid_admin_token'})}}
function hashAdminCode(code){return crypto.createHash('sha256').update(String(code)).digest('hex')}
function timingCodeMatch(a,b){const x=Buffer.from(String(a)),y=Buffer.from(String(b));return x.length===y.length&&crypto.timingSafeEqual(x,y)}
function newAdminCode(){return crypto.randomBytes(24).toString('base64url').slice(0,ADMIN_CODE_LIMIT)}
function audit(actor,target,action,role,details=''){db.prepare('INSERT INTO admin_audit_log(actor_user_id,target_user_id,action,role,details) VALUES(?,?,?,?,?)').run(actor?Number(actor):null,target?Number(target):null,action,role||null,details)}
function roleRank(role){return ADMIN_RANK[role]??ADMIN_RANK.user}
function canAssign(actorRole,targetRole){const p=ADMIN_POLICY[actorRole];return !!p&&p.appoints.includes(targetRole)}
function canManageTarget(actorRole,targetRole){if(targetRole==='founder')return actorRole==='founder';return roleRank(actorRole)<roleRank(targetRole)}
function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,birth_year:row.birth_year,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'' ,appointedAt:row.appointed_at||null}}
function assignmentCard(target,role,code,appointedBy){const p=ADMIN_POLICY[role];return `🎉 بطاقة تهنئة من وَثاق\n\nتهانينا ${target.name}!\nتم تعيينك رسميًا في منصب: ${p.icon} ${p.label}.\n\n🔐 رمز المنصب السري: ${code}\n\nللبدء في مهمتك واستلام الصلاحيات، يرجى التواصل مع مدير ومؤسس وَثاق لبدء مهمتك واستلام الصلاحيات.\n\nتم التعيين بواسطة: ${appointedBy.name} — ${ADMIN_POLICY[appointedBy.role]?.label||appointedBy.role}\n\nملاحظة أمنية: هذا الرمز سري ومخصص لهذا الحساب وهذا المنصب فقط. لا تشاركه مع أي شخص.`}
function sendAdminAppointmentMessage(target,body){const founder=db.prepare('SELECT id,wethaq_id,name FROM users WHERE wethaq_id=?').get(OWNER_WETHAQ_ID);if(!founder||founder.id===target.id)return;const status=isOnline(target.id)?'delivered':'sent';const z=db.prepare("INSERT INTO messages(sender_id,receiver_id,body,status,message_type) VALUES(?,?,?,?,'admin_assignment')").run(founder.id,target.id,body,status);const saved=db.prepare('SELECT * FROM messages WHERE id=?').get(z.lastInsertRowid);pushMessage(saved,founder,target);}
app.post('/api/admin/login',(req,res)=>{const name=safeName(req.body?.name),birthYear=Number(req.body?.birthYear),code=String(req.body?.adminCode||'').trim();if(!validText(name,MAX_NAME)||name.split(/\s+/).length<3||!Number.isInteger(birthYear)||birthYear<1900||birthYear>new Date().getUTCFullYear()||code.length<8||code.length>ADMIN_CODE_LIMIT)return res.status(400).json({error:'invalid_admin_credentials'});const key=`admin-login:${req.ip}:${name}`;if(!rateLimit(key,8,15*60*1000))return res.status(429).json({error:'too_many_attempts'});const r=db.prepare(`SELECT ar.*,u.name,u.wethaq_id,u.birth_year FROM admin_roles ar JOIN users u ON u.id=ar.user_id WHERE u.name=? AND u.birth_year=? AND ar.active=1`).get(name,birthYear);if(!r||!r.code_hash||!timingCodeMatch(hashAdminCode(code),r.code_hash))return res.status(401).json({error:'admin_invalid_code'});if(r.role!=='founder'&&r.subscription_expires_at&&new Date(r.subscription_expires_at)<=new Date()){db.prepare('UPDATE admin_roles SET active=0 WHERE user_id=?').run(r.user_id);return res.status(403).json({error:'admin_subscription_expired'})}res.json({token:adminTokenFor(r),role:r.role,label:ADMIN_POLICY[r.role].label,icon:ADMIN_POLICY[r.role].icon,subscriptionExpiresAt:r.subscription_expires_at||'',permissions:ADMIN_POLICY[r.role].permissions});});
app.post('/api/admin/founder-code',auth,(req,res)=>{if(req.user?.wethaqId!==OWNER_WETHAQ_ID)return res.status(403).json({error:'founder_only'});const u=db.prepare('SELECT * FROM users WHERE id=?').get(req.user.sub);if(!u)return res.status(404).json({error:'user_not_found'});const code=newAdminCode();db.prepare(`INSERT INTO admin_roles(user_id,role,code_hash,subscription_expires_at,appointed_by,appointed_by_role,appointed_at,active,code_version) VALUES(?,?,?,?,?,?,?,?,?) ON CONFLICT(user_id) DO UPDATE SET role='founder',code_hash=excluded.code_hash,subscription_expires_at=NULL,appointed_by=NULL,appointed_by_role=NULL,appointed_at=excluded.appointed_at,active=1,code_version=admin_roles.code_version+1`).run(u.id,'founder',hashAdminCode(code),null,null,null,now(),1,1);audit(u.id,u.id,'founder_code_issued','founder','bootstrap');res.json({ok:true,adminCode:code,role:'founder',label:ADMIN_POLICY.founder.label});});
app.get('/api/admin/role',adminAuth,(req,res)=>{const p=ADMIN_POLICY[req.adminRow.role];res.json({role:req.adminRow.role,label:p.label,icon:p.icon,fee:p.fee,subscriptionExpiresAt:req.adminRow.subscription_expires_at||'',permissions:p.permissions,appoints:p.appoints,capacity:p.capacity});});
app.get('/api/admin/policy',(_req,res)=>{res.json({roles:Object.entries(ADMIN_POLICY).map(([role,p])=>({role,...p}))});});
app.get('/api/admin/structure',(_req,res)=>{const roles=Object.entries(ADMIN_POLICY).map(([role,p])=>{const members=db.prepare(`SELECT ar.role,ar.appointed_at,ar.appointed_by,u.name,u.wethaq_id,u.birth_year,au.name appointed_by_name,ar.appointed_by_role FROM admin_roles ar JOIN users u ON u.id=ar.user_id LEFT JOIN users au ON au.id=ar.appointed_by WHERE ar.role=? AND ar.active=1 ORDER BY ar.appointed_at ASC`).all(role);return{role,label:p.label,icon:p.icon,fee:p.fee,capacity:p.capacity,activeCount:members.length,members:members.map(publicAdminMember)};});res.json({roles});});
app.post('/api/admin/assign',adminAuth,(req,res)=>{const targetId=String(req.body?.wethaqId||'').trim(),targetRole=String(req.body?.role||'').trim();if(!ADMIN_POLICY[targetRole]||!targetId)return res.status(400).json({error:'invalid_assignment'});if(!canAssign(req.adminRow.role,targetRole))return res.status(403).json({error:'assignment_not_allowed'});const target=db.prepare('SELECT id,name,wethaq_id,birth_year FROM users WHERE wethaq_id=?').get(targetId);if(!target)return res.status(404).json({error:'user_not_found'});if(target.wethaq_id===OWNER_WETHAQ_ID||targetRole==='founder')return res.status(403).json({error:'founder_protected'});const existing=activeAdminRole(target.id);if(existing)return res.status(409).json({error:'already_admin',role:existing.role});const policy=ADMIN_POLICY[targetRole];if(policy.capacity!==null){const count=db.prepare('SELECT COUNT(*) n FROM admin_roles WHERE role=? AND active=1').get(targetRole).n;if(count>=policy.capacity)return res.status(409).json({error:'role_capacity_reached',capacity:policy.capacity})}if(req.adminRow.role==='deputy1'&&targetRole==='admin_member'){const count=db.prepare('SELECT COUNT(*) n FROM admin_roles WHERE role=? AND active=1 AND appointed_by=?').get('admin_member',req.adminRow.user_id).n;if(count>=3)return res.status(409).json({error:'deputy1_admin_member_quota_reached',capacity:3})}const code=newAdminCode(),expires=targetRole==='founder'?null:new Date(Date.now()+365*24*60*60*1000).toISOString();const tx=db.transaction(()=>{db.prepare(`INSERT INTO admin_roles(user_id,role,code_hash,subscription_expires_at,appointed_by,appointed_by_role,appointed_at,active,code_version) VALUES(?,?,?,?,?,?,?,?,1)`).run(target.id,targetRole,hashAdminCode(code),expires,req.adminRow.user_id,req.adminRow.role,now(),1);audit(req.adminRow.user_id,target.id,'assign',targetRole,`code_version=1`);});tx();const actor={id:req.adminRow.user_id,name:req.adminRow.name,role:req.adminRow.role};sendAdminAppointmentMessage(target,assignmentCard(target,targetRole,code,actor));res.status(201).json({ok:true,user:{name:target.name,wethaq_id:target.wethaq_id},role:targetRole,label:policy.label,adminCode:code,subscriptionExpiresAt:expires||''});});
app.post('/api/admin/remove-role',adminAuth,(req,res)=>{const targetId=String(req.body?.wethaqId||'').trim(),target=db.prepare('SELECT id,name,wethaq_id FROM users WHERE wethaq_id=?').get(targetId);if(!target)return res.status(404).json({error:'user_not_found'});const current=activeAdminRole(target.id);if(!current)return res.status(404).json({error:'admin_role_not_found'});if(!canManageTarget(req.adminRow.role,current.role))return res.status(403).json({error:'removal_not_allowed'});db.prepare('UPDATE admin_roles SET active=0 WHERE user_id=?').run(target.id);audit(req.adminRow.user_id,target.id,'remove_role',current.role,'');res.json({ok:true});});
app.post('/api/admin/rbac/ban',adminAuth,(req,res)=>{const targetId=String(req.body?.wethaqId||'').trim(),minutes=Math.max(0,Number(req.body?.minutes||0)),reason=safeMessage(req.body?.reason||'بقرار من إدارة وَثاق');const target=db.prepare('SELECT id,name,wethaq_id FROM users WHERE wethaq_id=?').get(targetId);if(!target)return res.status(404).json({error:'user_not_found'});if(target.wethaq_id===OWNER_WETHAQ_ID)return res.status(403).json({error:'cannot_ban_founder'});const tr=activeAdminRole(target.id);const targetRole=tr?.role||'user';if(!canManageTarget(req.adminRow.role,targetRole))return res.status(403).json({error:'ban_scope_denied'});if(req.adminRow.role==='admin_member'&&minutes===0)return res.status(403).json({error:'admin_member_temporary_only'});db.prepare('DELETE FROM bans WHERE user_id=?').run(target.id);const type=minutes>0?'temporary':'permanent',expires=minutes>0?new Date(Date.now()+minutes*60000).toISOString():null;db.prepare('INSERT INTO bans(user_id,ban_type,expires_at,reason,created_by) VALUES(?,?,?,?,?)').run(target.id,type,expires,reason,req.adminRow.user_id);audit(req.adminRow.user_id,target.id,'ban',req.adminRow.role,JSON.stringify({minutes,reason}));res.json({ok:true,ban_type:type,expires_at:expires});});
app.post('/api/admin/alert',adminAuth,(req,res)=>{const targetId=String(req.body?.wethaqId||'').trim(),message=safeMessage(req.body?.message||'تنبيه من إدارة وَثاق');const target=db.prepare('SELECT id,name,wethaq_id FROM users WHERE wethaq_id=?').get(targetId);if(!target)return res.status(404).json({error:'user_not_found'});const tr=activeAdminRole(target.id),targetRole=tr?.role||'user';if(!canManageTarget(req.adminRow.role,targetRole))return res.status(403).json({error:'alert_scope_denied'});const founder=db.prepare('SELECT id,wethaq_id,name FROM users WHERE wethaq_id=?').get(OWNER_WETHAQ_ID);const sender=db.prepare('SELECT id,wethaq_id,name FROM users WHERE id=?').get(req.adminRow.user_id);const body=`⚠️ تنبيه إداري من وَثاق\n\n${message}\n\nالمرسل: ${sender?.name||'إدارة وَثاق'} — ${ADMIN_POLICY[req.adminRow.role]?.label||req.adminRow.role}`;if(founder&&target.id===founder.id)return res.status(403).json({error:'founder_protected'});const z=db.prepare("INSERT INTO messages(sender_id,receiver_id,body,status,message_type) VALUES(?,?,?,?,'admin_alert')").run(sender.id,target.id,body,isOnline(target.id)?'delivered':'sent');const saved=db.prepare('SELECT * FROM messages WHERE id=?').get(z.lastInsertRowid);pushMessage(saved,sender,target);audit(req.adminRow.user_id,target.id,'alert',req.adminRow.role,message);res.status(201).json({ok:true});});
app.get('/api/admin/audit-log',adminAuth,(req,res)=>{const rows=db.prepare(`SELECT l.*,a.name actor_name,t.name target_name FROM admin_audit_log l LEFT JOIN users a ON a.id=l.actor_user_id LEFT JOIN users t ON t.id=l.target_user_id ORDER BY l.id DESC LIMIT 200`).all();res.json({logs:rows});});
'''
          needle='server.listen(PORT,'
          if needle not in s:
              raise SystemExit('server.listen marker not found')
          s=s.replace(needle,block+'\n'+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit backend patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'wethaq-admin-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'feat: add isolated admin codes appointment messaging and role authentication'
          git push

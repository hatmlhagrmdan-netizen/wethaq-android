name: Validate Wethaq administrative access layer
on:
  push:
    branches: [main]
    paths:
      - 'backend/server.js'
      - 'backend/hardening.mjs'
      - '.github/workflows/apply-admin-access-layer.yml'
  pull_request:
    paths:
      - 'backend/server.js'
      - 'backend/hardening.mjs'
      - '.github/workflows/apply-admin-access-layer.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed admin security layer
        shell: bash
        run: |
          set -euo pipefail
          test -s backend/server.js
          test -s backend/hardening.mjs
          grep -q 'const ADMIN_RANK=' backend/server.js
          grep -q 'function adminAuth' backend/server.js
          grep -q 'const activeAdminRole=' backend/server.js
          grep -q 'admin_roles' backend/server.js
          grep -q 'admin_audit_log' backend/server.js
          grep -q "app.get('/health'" backend/server.js
          grep -q "app.post('/api/admin/assign'" backend/server.js
          grep -q "app.post('/api/admin/remove-role'" backend/server.js
          grep -q "app.post('/api/admin/rbac/ban'" backend/server.js
          grep -q 'target_wethaq_id' backend/hardening.mjs || true
          node --check backend/server.js
          node --check backend/hardening.mjs
          git diff --check
          echo 'Wethaq administrative access layer validation PASSED.'

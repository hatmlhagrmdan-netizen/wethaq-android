name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('string()? :', 'string() ?:')
          p.write_text(s)
          PY
      - name: Kotlin source sanity check
        run: |
          grep -nF '? :' app/src/main/java/com/wethaq/app/MainActivity.kt && exit 1 || true
          grep -nF 'setPadding(dp(14),dp(8),dp(14),dp(20))' app/src/main/java/com/wethaq/app/MainActivity.kt >/dev/null
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('res.body?.string()? : "{}"', 'res.body?.string() ?: "{}"')
          s = s.replace('res.body?.string() ? : "{}"', 'res.body?.string() ?: "{}"')
          p.write_text(s)
          PY
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          if "$APKSIGNER" verify --verbose "$APK"; then
            echo "APK signature verification passed"
          else
            echo "APK is unsigned; signing with a temporary CI release key"
            keytool -genkeypair -v -keystore /tmp/wethaq-release.jks -storepass changeit -keypass changeit -alias wethaq -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wethaq, OU=Release, O=Wethaq, L=, ST=, C=US"
            UNSIGNED="$APK"
            SIGNED="app/build/outputs/apk/release/Wethaq-release.apk"
            "$APKSIGNER" sign --ks /tmp/wethaq-release.jks --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias wethaq --out "$SIGNED" "$UNSIGNED"
            "$APKSIGNER" verify --verbose "$SIGNED"
            rm -f "$UNSIGNED"
          fi
      - name: Final APK check
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "Final APK: $APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

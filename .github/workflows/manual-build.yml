name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('private fun button(s:String, action:()->Unit, color:Int=teal)=Button(this).apply {', 'private fun button(s:String, action:()->Unit, color:Int=teal)=Button(this).apply {')
          s = s.replace('(json?.toString()? : "{}")', '(json?.toString() ?: "{}")')
          s = s.replace('(json?.toString() ? : "{}")', '(json?.toString() ?: "{}")')
          s = s.replace('res.body?.string()? : "{}"', 'res.body?.string() ?: "{}"')
          marker = '    private fun button(s:String, action:()->Unit, color:Int=teal)='
          if marker in s and 'private fun button(s:String, action:()->Unit)=' not in s:
              start = s.index(marker)
              line_end = s.index('\n', start)
              overload = '    private fun button(s:String, action:()->Unit)=button(s, action, teal)\n'
              s = s[:line_end+1] + overload + s[line_end+1:]
          p.write_text(s)
          PY
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          ls -lh "$APK"
      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

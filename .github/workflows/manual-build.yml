name: Wethaq Final Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Verify clean project
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f finalapp/build.gradle.kts
          test -f finalapp/src/main/AndroidManifest.xml
          test -f finalapp/src/main/java/com/wethaq/finalapp/MainActivity.java
          test -f finalapp/src/main/java/com/wethaq/finalapp/LauncherActivity.java
          grep -F 'include(":finalapp")' settings.gradle.kts
          grep -F 'applicationId = "com.wethaq.app"' finalapp/build.gradle.kts
          grep -F 'versionName = "2.0.0"' finalapp/build.gradle.kts
          git diff --check
      - name: Create isolated release key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wethaq-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/wethaq-signing/wethaq-release.jks" \
            -storepass 'WethaqBuild2026!' \
            -keypass 'WethaqBuild2026!' \
            -alias 'wethaq' \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Wethaq, OU=Wethaq, O=Wethaq, L=Raqqa, ST=Syria, C=SY'
          echo "WETHAQ_KEYSTORE=$RUNNER_TEMP/wethaq-signing/wethaq-release.jks" >> "$GITHUB_ENV"
          echo "WETHAQ_STORE_PASSWORD=WethaqBuild2026!" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_ALIAS=wethaq" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_PASSWORD=WethaqBuild2026!" >> "$GITHUB_ENV"
      - name: Build final release
        run: gradle :finalapp:clean :finalapp:assembleRelease --stacktrace --no-daemon --console=plain
      - name: Locate and validate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find finalapp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          stat -c '%n %s bytes' "$APK"
      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "${{ steps.apk.outputs.path }}" | grep -F "package: name='com.wethaq.app'"
          sha256sum "${{ steps.apk.outputs.path }}" | tee finalapp/build/outputs/apk/release/SHA256SUMS.txt
      - name: Publish canonical APK
        run: cp "${{ steps.apk.outputs.path }}" finalapp/build/outputs/apk/release/Wethaq-release.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-v2.0.0
          path: |
            finalapp/build/outputs/apk/release/Wethaq-release.apk
            finalapp/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Repair Kotlin source
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'button("تسجيل الدخول") { identityForm(false) }': 'button("تسجيل الدخول", { identityForm(false) })',
              'button("بحث عن مستخدم") { search(q.text.toString()) }': 'button("بحث عن مستخدم", { search(q.text.toString()) })',
              'button("إرسال") {\n            val body = input.text.toString().trim()\n            if (body.isNotBlank()) { input.setText(""); bubble(messages, body, "جاري الإرسال"); send(uid, body, messages) }\n        }': 'button("إرسال", {\n            val body = input.text.toString().trim()\n            if (body.isNotBlank()) { input.setText(""); bubble(messages, body, "جاري الإرسال"); send(uid, body, messages) }\n        })'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Validate source
        run: |
          set -e
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/java/com/wethaq/app/LauncherActivity.kt
          test -f app/src/main/AndroidManifest.xml
          grep -F 'button("تسجيل الدخول", { identityForm(false) })' app/src/main/java/com/wethaq/app/MainActivity.kt
          grep -F 'button("بحث عن مستخدم", { search(q.text.toString()) })' app/src/main/java/com/wethaq/app/MainActivity.kt
          git diff --check
      - name: Commit source repair
        run: |
          set -e
          git config user.name "Wethaq Build Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/wethaq/app/MainActivity.kt
          git diff --cached --quiet || git commit -m "Fix Kotlin button invocations"
          git push
      - name: Build release
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'Wethaq-release.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"
          sha256sum "${{ steps.apk.outputs.path }}" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          test "${{ steps.apk.outputs.size }}" -gt 100000
      - name: Publish Wethaq-release.apk
        run: cp "${{ steps.apk.outputs.path }}" app/build/outputs/apk/release/Wethaq-release.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: |
            app/build/outputs/apk/release/Wethaq-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate project
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          grep -F 'applicationId = "com.wethaq.app"' app/build.gradle.kts
          grep -F 'versionName = "1.8.0"' app/build.gradle.kts
          git diff --check
      - name: Create temporary release signing key when repository signing secrets are unavailable
        env:
          STORE_PASSWORD: ${{ secrets.WETHAQ_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using configured Wethaq release signing credentials"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/wethaq-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/wethaq-signing/wethaq-release.jks" \
            -storepass "WethaqBuild2026!" \
            -keypass "WethaqBuild2026!" \
            -alias "wethaq" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=Wethaq, OU=Wethaq, O=Wethaq, L=Raqqa, ST=Syria, C=SY"
          echo "WETHAQ_KEYSTORE=$RUNNER_TEMP/wethaq-signing/wethaq-release.jks" >> "$GITHUB_ENV"
          echo "WETHAQ_STORE_PASSWORD=WethaqBuild2026!" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_ALIAS=wethaq" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_PASSWORD=WethaqBuild2026!" >> "$GITHUB_ENV"
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"
      - name: Verify and fingerprint APK
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"
          sha256sum "${{ steps.apk.outputs.path }}" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          test "${{ steps.apk.outputs.size }}" -gt 100000
      - name: Publish canonical APK filename
        run: cp "${{ steps.apk.outputs.path }}" app/build/outputs/apk/release/Wethaq-release.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: |
            app/build/outputs/apk/release/Wethaq-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

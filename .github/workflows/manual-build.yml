name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate source
        run: |
          set -e
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/java/com/wethaq/app/LauncherActivity.kt
          test -f app/src/main/AndroidManifest.xml
          git diff --check
      - name: Build release
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'Wethaq-release.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Verify APK
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${{ steps.apk.outputs.path }}"
          sha256sum "${{ steps.apk.outputs.path }}"
      - name: Publish Wethaq-release.apk
        run: cp "${{ steps.apk.outputs.path }}" app/build/outputs/apk/release/Wethaq-release.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: app/build/outputs/apk/release/Wethaq-release.apk
          if-no-files-found: error
          retention-days: 90

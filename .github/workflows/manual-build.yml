name: Wethaq Release Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('private fun button(s:String, action:()->Unit, color:Int=teal)=Button(this).apply {', 'private fun button(s:String, action:()->Unit, color:Int=teal)=Button(this).apply {')
          marker = '    private fun button(s:String, action:()->Unit, color:Int=teal)='
          if marker in s and 'private fun button(s:String, action:()->Unit)=button(s, action, teal)' not in s:
              start = s.index(marker)
              end = s.index('\n', start)
              s = s[:end+1] + '    private fun button(s:String, action:()->Unit)=button(s, action, teal)\n' + s[end+1:]
          s = s.replace('(json?.toString()? : "{}")', '(json?.toString() ?: "{}")')
          s = s.replace('(json?.toString() ? : "{}")', '(json?.toString() ?: "{}")')
          s = s.replace('res.body?.string()? : "{}"', 'res.body?.string() ?: "{}"')
          s = s.replace('res.body?.string() ? : "{}"', 'res.body?.string() ?: "{}"')
          p.write_text(s)
          PY
      - name: Build release APK
        run: gradle clean assembleRelease --stacktrace --no-daemon --console=plain
      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
      - name: Sign and verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          if "$APKSIGNER" verify --verbose "$APK"; then
            FINAL="$APK"
          else
            keytool -genkeypair -v -keystore /tmp/wethaq-release.jks -storepass changeit -keypass changeit -alias wethaq -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wethaq, OU=Release, O=Wethaq, C=US"
            FINAL="app/build/outputs/apk/release/Wethaq-release.apk"
            "$APKSIGNER" sign --ks /tmp/wethaq-release.jks --ks-pass pass:changeit --key-pass pass:changeit --ks-key-alias wethaq --out "$FINAL" "$APK"
          fi
          "$APKSIGNER" verify --verbose "$FINAL"
          test -s "$FINAL"
          echo "FINAL_APK=$FINAL"
          sha256sum "$FINAL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

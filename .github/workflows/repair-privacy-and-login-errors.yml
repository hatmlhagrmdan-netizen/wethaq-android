name: Wethaq Privacy and Login Error Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-privacy-and-login-errors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply minimal safe repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('backend/server.js')
          s = backend.read_text(encoding='utf-8')
          old_member = "function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,birth_year:row.birth_year,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'' ,appointedAt:row.appointed_at||null}}"
          new_member = "function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'' ,appointedAt:row.appointed_at||null}}"
          if old_member in s:
              s = s.replace(old_member, new_member, 1)
          old_query = "u.name,u.wethaq_id,u.birth_year,au.name appointed_by_name"
          new_query = "u.name,u.wethaq_id,au.name appointed_by_name"
          if old_query in s:
              s = s.replace(old_query, new_query, 1)
          backend.write_text(s, encoding='utf-8')

          app = Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          a = app.read_text(encoding='utf-8')
          old = 'if(!x.isEmpty())return x;'
          new = '''if("user_not_found".equals(x))return "الهوية غير موجودة. تحقق من الاسم وسنة الميلاد.";\nif("invalid_personal_code".equals(x))return "رمز المرور الشخصي غير صحيح.";\nif("personal_code_not_set".equals(x))return "لم يتم تعيين رمز المرور الشخصي لهذه الهوية.";\nif("identity_claimed".equals(x))return "هذه الهوية مرتبطة بجهاز آخر. استخدم رمز المرور الشخصي الصحيح.";\nif("invalid_identity".equals(x))return "بيانات الهوية غير صالحة.";\nif(r.code>=500)return "الخادم غير متاح حاليًا. حاول مرة أخرى.";\nif(!x.isEmpty())return x;'''
          if old in a:
              a = a.replace(old, new, 1)
          app.write_text(a, encoding='utf-8')
          PY

      - name: Validate repairs
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/server.js
          grep -q "function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,role:row.role" backend/server.js
          ! grep -q "function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,birth_year" backend/server.js
          grep -q 'q.put("deviceKey",deviceKey());' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'user_not_found' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'invalid_personal_code' app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wethaq CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- backend/server.js app/src/main/java/com/wethaq/app/MainActivity.java; then
            echo 'No repairs were necessary.'
            exit 0
          fi
          git add backend/server.js app/src/main/java/com/wethaq/app/MainActivity.java
          git commit -m 'fix: harden admin privacy and login error handling'
          git push origin HEAD:main

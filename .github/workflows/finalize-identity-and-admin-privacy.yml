name: Finalize identity and admin privacy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-identity-and-admin-privacy.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/server.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,birth_year:row.birth_year,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'' ,appointedAt:row.appointed_at||null}}", "function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,role:row.role,appointedBy:row.appointed_by_name?`${row.appointed_by_name} — ${row.appointed_by_role||''}`.trim():'' ,appointedAt:row.appointed_at||null}}")
          s=s.replace("u.name,u.wethaq_id,u.birth_year,au.name appointed_by_name", "u.name,u.wethaq_id,au.name appointed_by_name")
          p.write_text(s,encoding='utf-8')

          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='private String error(HttpResult r){try{JSONObject o=new JSONObject(r.body);String x=o.optString("error");if("user_banned".equals(x)){String type=o.optString("ban_type");String until=o.optString("expires_at");return "الحساب محظور"+("temporary".equals(type)&&!until.isEmpty()?" حتى "+until:"")+". "+o.optString("reason","");}if(!x.isEmpty())return x;}catch(Exception ignored){}return "HTTP "+r.code;}'
          new='private String error(HttpResult r){try{JSONObject o=new JSONObject(r.body);String x=o.optString("error");if("user_banned".equals(x)){String type=o.optString("ban_type");String until=o.optString("expires_at");return "الحساب محظور"+("temporary".equals(type)&&!until.isEmpty()?" حتى "+until:"")+". "+o.optString("reason","");}if("user_not_found".equals(x))return "الهوية غير موجودة. اضغط «إنشاء هوية جديدة» أولًا.";if("invalid_personal_code".equals(x))return "رمز المرور الشخصي غير صحيح.";if("personal_code_not_set".equals(x))return "رمز المرور الشخصي غير مُعيّن لهذه الهوية.";if("identity_claimed".equals(x))return "هذه الهوية مرتبطة بجهاز آخر.";if("invalid_identity".equals(x))return "بيانات الهوية غير صالحة. تأكد من الاسم الثلاثي وسنة الميلاد ورمز المرور الشخصي.";if(!x.isEmpty())return x;}catch(Exception ignored){}return r.code>=500?"الخادم غير متاح حاليًا. حاول مرة أخرى.":"HTTP "+r.code;}'
          if old not in s:
              raise SystemExit('MainActivity error() target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify source invariants
        run: |
          grep -q 'function publicAdminMember(row){return{name:row.name,wethaq_id:row.wethaq_id,role:row.role' backend/server.js
          ! grep -q 'publicAdminMember(row).*birth_year' backend/server.js
          grep -q '"/api/identity"' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q '"/api/login"' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'invalid_personal_code' app/src/main/java/com/wethaq/app/MainActivity.java
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/server.js app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --cached --quiet || git commit -m 'fix: clarify identity errors and protect admin birth year'
          git push

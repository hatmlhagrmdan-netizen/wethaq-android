name: Wethaq Visual Admin Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair generated source and workflow
        shell: python
        run: |
          from pathlib import Path
          pub=Path('app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java')
          s=pub.read_text(encoding='utf-8')
          if not s.rstrip().endswith('}'):
              pub.write_text(s.rstrip()+'\n}\n',encoding='utf-8')
          wf=Path('.github/workflows/wethaq-visual-admin-upgrade.yml')
          w=wf.read_text(encoding='utf-8')
          w=w.replace("grep -q '20$ سنويًا'", "grep -Fq '20$ سنويًا'")
          w=w.replace("grep -q '17$ سنويًا'", "grep -Fq '17$ سنويًا'")
          w=w.replace("grep -q '12$ سنويًا'", "grep -Fq '12$ سنويًا'")
          w=w.replace("grep -q '8$ سنويًا'", "grep -Fq '8$ سنويًا'")
          wf.write_text(w,encoding='utf-8')
          print('repair complete')
      - name: Verify and build
        run: |
          git diff --check
          grep -Fq '20$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -Fq '17$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -Fq '12$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          grep -Fq '8$ سنويًا' app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon
      - name: Publish repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java .github/workflows/wethaq-visual-admin-upgrade.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize visual admin upgrade build'
          git push origin HEAD:main

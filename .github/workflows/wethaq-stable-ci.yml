name: Wethaq Stable CI

on:
  push:
    branches:
      - foundation/stable-20260905
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wethaq-stable-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-verify:
    name: Validate, build and verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: true
          validate-wrappers: true

      - name: Repository integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f backend/package.json
          test -f backend/server.js
          grep -q "applicationId 'com.wethaq.app'" app/build.gradle
          grep -q "signingConfig signingConfigs.debug" app/build.gradle
          git diff --check
          if grep -RInE 'WETHAQ_KEYSTORE|WETHAQ_KEY_ALIAS|signingConfigs\.release|\.jks|\.keystore' . --exclude-dir=.git --exclude='wethaq-stable-ci.yml'; then
            echo 'Production signing material/configuration detected in source tree.'
            exit 1
          fi

      - name: Validate backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --input-type=commonjs -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); db.prepare('select 1').get(); db.close(); console.log('BETTER_SQLITE3_NATIVE_OK')"

      - name: Backend health smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export PORT=3100
          export DB_PATH="$RUNNER_TEMP/wethaq-ci.sqlite"
          export JWT_SECRET='wethaq-ci-only-secret'
          export OWNER_WETHAQ_ID='ci-owner'
          rm -f "$DB_PATH" "$RUNNER_TEMP/wethaq-backend.log"
          node server.js > "$RUNNER_TEMP/wethaq-backend.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/wethaq-backend.log" || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/health
          echo
          echo 'WETHAQ_BACKEND_HEALTH_OK'

      - name: Build release candidate
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean test assembleRelease --stacktrace --console=plain

      - name: Verify APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK"
          echo 'WETHAQ_APK_VERIFY_OK'

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-candidate-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# Stable foundation: source is fixed before CI; CI never rewrites application code.

name: Wethaq Production Release

on:
  push:
    branches: [main, production-final-2.0.2]
    paths:
      - 'app/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/wethaq-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/res/values/styles.xml
          grep -q "include ':app'" settings.gradle
          grep -q "applicationId 'com.wethaq.app'" app/build.gradle
          grep -q "signingConfig signingConfigs.debug" app/build.gradle
          grep -q "receiver_id" app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q "wethaq-backend-production.up.railway.app" app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --check
      - name: Build signed release APK
        shell: bash
        run: gradle :app:clean :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-2.0.2-final-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

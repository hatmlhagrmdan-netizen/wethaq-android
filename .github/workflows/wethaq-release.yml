name: Wethaq Final Release

on:
  push:
    branches: [main]
    paths:
      - 'finalapp/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/wethaq-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WETHAQ_STORE_PASSWORD: wethaq-ci-store-2026
      WETHAQ_KEY_ALIAS: wethaq-release
      WETHAQ_KEY_PASSWORD: wethaq-ci-key-2026
      WETHAQ_KEYSTORE: ${{ github.workspace }}/wethaq-release.keystore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Create isolated release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$WETHAQ_KEYSTORE" \
            -storepass "$WETHAQ_STORE_PASSWORD" \
            -keypass "$WETHAQ_KEY_PASSWORD" \
            -alias "$WETHAQ_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Wethaq Release, OU=Wethaq, O=Wethaq, L=Online, ST=NA, C=SY"
          test -s "$WETHAQ_KEYSTORE"

      - name: Validate final project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f finalapp/build.gradle.kts
          test -f finalapp/src/main/AndroidManifest.xml
          test -f finalapp/src/main/java/com/wethaq/finalapp/MainActivity.java
          test -f finalapp/src/main/java/com/wethaq/finalapp/LauncherActivity.java
          grep -q 'include(":finalapp")' settings.gradle.kts
          grep -q 'applicationId = "com.wethaq.app"' finalapp/build.gradle.kts
          grep -q 'versionName = "2.0.0"' finalapp/build.gradle.kts
          git diff --check

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :finalapp:clean :finalapp:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Locate and inspect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="finalapp/build/outputs/apk/release/finalapp-release.apk"
          test -f "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT2" dump badging "$APK" | grep -q "package: name='com.wethaq.app'"
          sha256sum "$APK" | tee finalapp/build/outputs/apk/release/SHA256SUMS.txt

      - name: Prepare canonical release file
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.apk.outputs.path }}" finalapp/build/outputs/apk/release/Wethaq-release-v2.0.0.apk
          test -s finalapp/build/outputs/apk/release/Wethaq-release-v2.0.0.apk

      - name: Upload final release
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-release-v2.0.0
          path: |
            finalapp/build/outputs/apk/release/Wethaq-release-v2.0.0.apk
            finalapp/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

name: Wethaq Final Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'scripts/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wethaq-final-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate source and security invariants
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$GITHUB_SHA"
          python3 -m py_compile scripts/finalize_identity.py scripts/final_repair.py scripts/repair_identity_security.py
          node --check backend/server.js
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/java/com/wethaq/app/VideoCallActivity.java
          test -f app/src/main/java/com/wethaq/app/WethaqMessageService.java
          test -f app/src/main/java/com/wethaq/app/WethaqBootReceiver.java
          grep -q 'personalCode' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'personal_code_hash' backend/server.js
          grep -q "auth:'name_birth_year_personal_code'" backend/server.js
          grep -q 'invalid_personal_code' backend/server.js
          grep -q 'personal_code_not_set' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          grep -q 'incomingOffer' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'showIncomingCall' app/src/main/java/com/wethaq/app/WethaqMessageService.java
          grep -q 'notification_target' app/src/main/java/com/wethaq/app/WethaqMessageService.java
          grep -q 'AdminAccessActivity' app/src/main/AndroidManifest.xml
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'setElevation' app/src/main/java/com/wethaq/app/MainActivity.java
          ! grep -RIn --exclude='*.md' --exclude='*.py' --exclude-dir=.github/workflows -E '(password|secret|api[_-]?key|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{20,}["'"']' app backend 2>/dev/null
          git diff --check

      - name: Validate production backend hardening contract
        shell: bash
        env:
          NODE_ENV: production
        run: node backend/runtime-hardening.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Prepare ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/wethaq-ci-release.jks"
          ALIAS="wethaq-ci"
          PASS="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Wethaq CI Validation, OU=Wethaq, O=Wethaq, L=CI, ST=CI, C=SY"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$PASS" -alias "$ALIAS" >/dev/null
          {
            echo "WETHAQ_KEYSTORE_PATH=$KEYSTORE"
            echo "WETHAQ_KEYSTORE_PASSWORD=$PASS"
            echo "WETHAQ_KEY_ALIAS=$ALIAS"
            echo "WETHAQ_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Backend smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --no-audit --no-fund
          DB_FILE="$RUNNER_TEMP/wethaq-smoke.db"
          LOG_FILE="$RUNNER_TEMP/wethaq-backend.log"
          JWT_TEST_SECRET="$(openssl rand -hex 32)"
          PORT=3100 DB_PATH="$DB_FILE" JWT_SECRET="$JWT_TEST_SECRET" OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' node server.js > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Backend failed health check.'
            cat "$LOG_FILE"
            exit 1
          fi
          PORT=3100 node smoke-test.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Build release APK from exact checked-out commit
        shell: bash
        run: gradle :app:clean :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "WETHAQ_FINAL_RELEASE_APK_OK"
          echo "WETHAQ_FINAL_RELEASE_SOURCE=$GITHUB_SHA" | tee app/build/outputs/apk/release/PROVENANCE.txt

      - name: Publish final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-final-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

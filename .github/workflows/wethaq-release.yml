name: Wethaq Final Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/wethaq-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Validate final source and provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/java/com/wethaq/app/VideoCallActivity.java
          test -f app/src/main/java/com/wethaq/app/WethaqMessageService.java
          test -f app/src/main/java/com/wethaq/app/WethaqBootReceiver.java
          grep -q "versionName '1.0.0'" app/build.gradle
          grep -q 'VERSION = "1.0.0"' app/src/main/java/com/wethaq/app/BuildInfo.java
          grep -q 'private Button btn(String s)' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'setElevation' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'incomingOffer' app/src/main/java/com/wethaq/app/VideoCallActivity.java
          grep -q 'showIncomingCall(id,name,audioOnly,payload)' app/src/main/java/com/wethaq/app/WethaqMessageService.java
          grep -q 'notification_target' app/src/main/java/com/wethaq/app/WethaqMessageService.java
          ! grep -q 'final String fn=n,fy=y' app/src/main/java/com/wethaq/app/MainActivity.java
          ! grep -q 'q.put("name",fn)' app/src/main/java/com/wethaq/app/MainActivity.java
          ! grep -q 'Integer.parseInt(fy)' app/src/main/java/com/wethaq/app/MainActivity.java
          ! find app -type f -name '*.kt' | grep -q .
          if grep -RIn --exclude='*.md' --exclude='.env.example' -E '(password|secret|api[_-]?key|private[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{12,}["'"']' app backend .github 2>/dev/null; then
            echo 'Potential hard-coded secret detected'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
      - name: Backend smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --no-audit --no-fund
          DB_FILE="$RUNNER_TEMP/wethaq-smoke.db"
          PORT=3100 DB_PATH="$DB_FILE" JWT_SECRET='wethaq-ci-test-secret-change-me' OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' node server.js > "$RUNNER_TEMP/wethaq-backend.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3100/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/health >/dev/null
          PORT=3100 node smoke-test.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Backend smoke configuration check
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/package.json
          test -f backend/server.js
          grep -q 'wss' app/src/main/java/com/wethaq/app/WethaqMessageService.java
          grep -q '/api/calls/signal' app/src/main/java/com/wethaq/app/VideoCallActivity.java
      - name: Build release APK
        shell: bash
        run: gradle :app:clean :app:assembleRelease --no-daemon --stacktrace --console=plain
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Publish final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-final-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

name: Wethaq Unified CI and Production Release
# Mainline gates: backend/security, Android 16, APK+AAB, protected production signing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wethaq-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate Backend, Security and CI APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Repository integrity and source audit
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/java/com/wethaq/app/VideoCallActivity.java
          test -f app/src/main/java/com/wethaq/app/WethaqMessageService.java
          test -f app/src/main/java/com/wethaq/app/WethaqBootReceiver.java
          test -f backend/package.json
          test -f backend/server.js
          test -f backend/audit-access-guard.mjs
          test -f backend/smoke-test.mjs
          test -f backend/security-smoke-test.mjs
          test -f backend/hardening-smoke.mjs
          test -f scripts/mainline_stable_audit.py
          test -f backend/runtime-hardening.mjs
          python3 -m py_compile scripts/mainline_stable_audit.py
          node --check backend/server.js
          node --check backend/audit-access-guard.mjs
          node --check backend/runtime-hardening.mjs
          node --check backend/smoke-test.mjs
          node --check backend/security-smoke-test.mjs
          node --check backend/hardening-smoke.mjs
          grep -q 'personal_code_hash' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          grep -q 'AdminAccessActivity' app/src/main/AndroidManifest.xml
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'ACTION_PICK_IMAGES' app/src/main/java/com/wethaq/app/MainActivity.java
          if grep -q 'READ_MEDIA_IMAGES' app/src/main/AndroidManifest.xml; then
            echo 'READ_MEDIA_IMAGES must not be requested; the app uses the system photo picker.'
            exit 1
          fi
          git diff --check
      - name: Mainline architecture and security audit
        run: python3 scripts/mainline_stable_audit.py
      - name: Reject committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE -- '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' app/src backend; then
            echo 'Private-key material detected in runtime source.'
            exit 1
          fi
      - name: Backend install and security smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          export PORT=3100
          export DB_PATH="$RUNNER_TEMP/wethaq-validation.sqlite"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995'
          rm -f "$DB_PATH" "$RUNNER_TEMP/wethaq-validation.log"
          npm start > "$RUNNER_TEMP/wethaq-validation.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/wethaq-validation.log"; exit 1; fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/health >/dev/null
          NODE_ENV=production node runtime-hardening.mjs
          timeout 90s env PORT=3100 node security-smoke-test.mjs
          timeout 90s env PORT=3100 node smoke-test.mjs
          timeout 90s env PORT=3100 node hardening-smoke.mjs
          timeout 90s env PORT=3100 node hardening-smoke.mjs
      - name: Build CI APK and AAB
        run: gradle --no-daemon clean test assembleCi bundleCi --stacktrace --console=plain
      - name: Enable KVM for Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Android 16 compatibility smoke
        id: android16
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-linux-hw-accel: false
          script: |
            set -eu
            adb install -r app/build/outputs/apk/ci/app-ci.apk
            adb shell getprop ro.build.version.sdk | grep -qx '36'
            adb install -r app/build/outputs/apk/ci/app-ci.apk
            adb shell pm list packages | grep -Fq 'package:com.wethaq.app'
            adb shell am force-stop com.wethaq.app || true
            adb shell am start -n com.wethaq.app/.MainActivity >/tmp/wethaq-start.txt 2>&1
            cat /tmp/wethaq-start.txt
            sleep 3
            adb shell pidof com.wethaq.app >/dev/null
      - name: Verify CI APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/ci/app-ci.apk'
          AAB='app/build/outputs/bundle/ci/app-ci.aab'
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          sha256sum "$APK" "$AAB" | tee app/build/outputs/apk/ci/SHA256SUMS.txt
          echo "WETHAQ_CI_SOURCE=$GITHUB_SHA" > app/build/outputs/apk/ci/PROVENANCE.txt
      - name: Publish CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-CI-${{ github.sha }}
          path: |
            app/build/outputs/apk/ci/app-ci.apk
            app/build/outputs/bundle/ci/app-ci.aab
            app/build/outputs/apk/ci/SHA256SUMS.txt
            app/build/outputs/apk/ci/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

  production:
    name: Protected Production APK
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: validation
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true
      - name: Initialize protected keystore path
        shell: bash
        run: echo "WETHAQ_KEYSTORE_PATH=$RUNNER_TEMP/wethaq-production.jks" >> "$GITHUB_ENV"
      - name: Validate protected production secrets
        shell: bash
        env:
          WETHAQ_PRODUCTION_KEYSTORE_B64: ${{ secrets.WETHAQ_PRODUCTION_KEYSTORE_B64 }}
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WETHAQ_PRODUCTION_KEYSTORE_B64" || { echo 'Missing production keystore secret'; exit 1; }
          test -n "$WETHAQ_KEYSTORE_PASSWORD" || { echo 'Missing keystore password secret'; exit 1; }
          test -n "$WETHAQ_KEY_ALIAS" || { echo 'Missing key alias secret'; exit 1; }
          test -n "$WETHAQ_KEY_PASSWORD" || { echo 'Missing key password secret'; exit 1; }
          printf '%s' "$WETHAQ_PRODUCTION_KEYSTORE_B64" | base64 --decode > "$WETHAQ_KEYSTORE_PATH"
          chmod 600 "$WETHAQ_KEYSTORE_PATH"
          keytool -list -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" >/dev/null
      - name: Validate production source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/mainline_stable_audit.py
          node --check backend/server.js
          node --check backend/audit-access-guard.mjs
          node --check backend/runtime-hardening.mjs
          grep -q 'personal_code_hash' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          grep -q 'AdminAccessActivity' app/src/main/AndroidManifest.xml
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          git diff --check
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Backend production smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          DB_FILE="$RUNNER_TEMP/wethaq-production-smoke.db"
          LOG_FILE="$RUNNER_TEMP/wethaq-production-backend.log"
          PORT=3100 DB_PATH="$DB_FILE" JWT_SECRET="$(openssl rand -hex 32)" OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' npm start > "$LOG_FILE" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then cat "$LOG_FILE"; exit 1; fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/health >/dev/null
          NODE_ENV=production node runtime-hardening.mjs
          timeout 90s env PORT=3100 node security-smoke-test.mjs
          timeout 90s env PORT=3100 node smoke-test.mjs
      - name: Build protected production APK and AAB
        env:
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --console=plain
      - name: Verify protected certificate and APK signer
        shell: bash
        env:
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_CERT_SHA256: ${{ secrets.WETHAQ_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Number of signers: 1' "$RUNNER_TEMP/apksigner.txt"
          EXPECTED='64:4B:F1:1F:70:99:10:F4:FB:53:16:FB:76:E7:AD:FB:30:4C:03:71:62:69:F0:27:A7:BF:37:F7:45:DF:FE:D3'
          APK_CERT_DIGEST="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | head -n1 | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "$APK_CERT_DIGEST" = "$EXPECTED_NORMALIZED" || { echo 'Production APK signer certificate fingerprint mismatch.'; exit 1; }
          keytool -list -v -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" > "$RUNNER_TEMP/production-cert.txt"
          KEYSTORE_CERT_DIGEST="$(grep -i 'SHA256:' "$RUNNER_TEMP/production-cert.txt" | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "$KEYSTORE_CERT_DIGEST" = "$EXPECTED_NORMALIZED" || { echo 'Production keystore certificate fingerprint mismatch.'; exit 1; }
          EXPECTED_NORMALIZED="$(printf '%s' "$EXPECTED" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          AAB_CERT_DIGEST="$(grep -i '^[[:space:]]*SHA256:' "$RUNNER_TEMP/aab-cert.txt" | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test -n "$AAB_CERT_DIGEST" || { echo 'Production AAB signer certificate fingerprint could not be read.'; exit 1; }
          echo "Production AAB signer SHA-256: $AAB_CERT_DIGEST"
          test "$AAB_CERT_DIGEST" = "$EXPECTED_NORMALIZED" || { echo 'Production AAB signer certificate fingerprint mismatch.'; exit 1; }
          sha256sum "$APK" "$AAB" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          echo "WETHAQ_PRODUCTION_SOURCE=$GITHUB_SHA" > app/build/outputs/apk/release/PROVENANCE.txt
          echo 'WETHAQ_PRODUCTION_APK_VERIFIED'
      - name: Publish protected production artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-production-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Secure cleanup
        if: always()
        shell: bash
        run: rm -f "$WETHAQ_KEYSTORE_PATH" "$RUNNER_TEMP/apksigner.txt" "$RUNNER_TEMP/production-cert.txt" "$RUNNER_TEMP/aab-cert.rsa" "$RUNNER_TEMP/aab-cert.txt"

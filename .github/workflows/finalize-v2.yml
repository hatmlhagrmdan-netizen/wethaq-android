name: Wethaq Final V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final fixes
        run: python3 scripts/finalize_v2.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release
        run: chmod +x gradlew 2>/dev/null || true; ./gradlew clean assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo WETHAQ_FINAL_V2_APK_OK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-V2-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

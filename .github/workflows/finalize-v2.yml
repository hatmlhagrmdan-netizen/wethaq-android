name: Wethaq Unified CI and Production Release
# مسار إنتاج موحد: تحقق المصدر والأمان -> خادم الاختبار -> بناء الإنتاج -> Android 16 -> توقيع -> بصمات -> إصدار.
# لا توجد نسخة CI ثانية ولا بناء APK/AAB مكرر.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wethaq-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Wethaq Production Unified Gate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Initialize protected keystore path
        shell: bash
        run: echo "WETHAQ_KEYSTORE_PATH=$RUNNER_TEMP/wethaq-production.jks" >> "$GITHUB_ENV"

      - name: Validate protected production secrets
        shell: bash
        env:
          WETHAQ_PRODUCTION_KEYSTORE_B64: ${{ secrets.WETHAQ_PRODUCTION_KEYSTORE_B64 }}
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
          WETHAQ_CERT_SHA256: ${{ secrets.WETHAQ_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$WETHAQ_PRODUCTION_KEYSTORE_B64" || { echo 'Missing production keystore secret'; exit 1; }
          test -n "$WETHAQ_KEYSTORE_PASSWORD" || { echo 'Missing keystore password secret'; exit 1; }
          test -n "$WETHAQ_KEY_ALIAS" || { echo 'Missing key alias secret'; exit 1; }
          test -n "$WETHAQ_KEY_PASSWORD" || { echo 'Missing key password secret'; exit 1; }
          test -n "$WETHAQ_CERT_SHA256" || { echo 'Missing production certificate SHA-256 secret'; exit 1; }
          EXPECTED_CERT="$(printf '%s' "$WETHAQ_CERT_SHA256" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "${#EXPECTED_CERT}" -eq 64 || { echo 'Production certificate SHA-256 must contain 64 hexadecimal characters'; exit 1; }
          printf '%s' "$WETHAQ_PRODUCTION_KEYSTORE_B64" | base64 --decode > "$WETHAQ_KEYSTORE_PATH"
          chmod 600 "$WETHAQ_KEYSTORE_PATH"
          keytool -list -v -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" > "$RUNNER_TEMP/production-cert.txt"
          grep -q 'CN=Wethaq Production' "$RUNNER_TEMP/production-cert.txt"
          grep -q 'OU=Release' "$RUNNER_TEMP/production-cert.txt"
          grep -q 'O=Wethaq' "$RUNNER_TEMP/production-cert.txt"
          grep -q 'C=SY' "$RUNNER_TEMP/production-cert.txt"
          STORE_CERT="$(grep -i 'SHA256:' "$RUNNER_TEMP/production-cert.txt" | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "$STORE_CERT" = "$EXPECTED_CERT" || { echo 'Protected keystore certificate fingerprint mismatch.'; exit 1; }

      - name: Repository integrity and source security audit
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/java/com/wethaq/app/VideoCallActivity.java
          test -f app/src/main/java/com/wethaq/app/WethaqMessageService.java
          test -f app/src/main/java/com/wethaq/app/WethaqBootReceiver.java
          test -f backend/package.json
          test -f backend/server.js
          test -f backend/smoke-test.mjs
          test -f backend/security-smoke-test.mjs
          test -f backend/hardening-smoke.mjs
          test -f scripts/mainline_stable_audit.py
          test -f backend/runtime-hardening.mjs
          python3 -m py_compile scripts/mainline_stable_audit.py
          node --check backend/server.js
          node --check backend/runtime-hardening.mjs
          node --check backend/smoke-test.mjs
          node --check backend/security-smoke-test.mjs
          node --check backend/hardening-smoke.mjs
          grep -q 'personal_code_hash' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          grep -q 'AdminAccessActivity' app/src/main/AndroidManifest.xml
          grep -q 'PublicAdministrationActivity' app/src/main/AndroidManifest.xml
          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'ACTION_PICK_IMAGES' app/src/main/java/com/wethaq/app/MainActivity.java
          if grep -q 'READ_MEDIA_IMAGES' app/src/main/AndroidManifest.xml; then
            echo 'READ_MEDIA_IMAGES must not be requested; the app uses the system photo picker.'
            exit 1
          fi
          if grep -RInE -- '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' app/src backend; then
            echo 'Private-key material detected in runtime source.'
            exit 1
          fi
          git diff --check
          python3 scripts/mainline_stable_audit.py

      - name: Backend production smoke
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          DB_FILE="$RUNNER_TEMP/wethaq-production-smoke.db"
          LOG_FILE="$RUNNER_TEMP/wethaq-production-backend.log"
          PORT=3100 DB_PATH="$DB_FILE" JWT_SECRET="$(openssl rand -hex 32)" OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' npm start > "$LOG_FILE" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then cat "$LOG_FILE"; exit 1; fi
            if curl -fsS --max-time 2 http://127.0.0.1:3100/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:3100/health >/dev/null
          NODE_ENV=production node runtime-hardening.mjs
          timeout 90s env PORT=3100 node security-smoke-test.mjs
          timeout 90s env PORT=3100 node smoke-test.mjs
          HARDENING_PORT=3101
          DB_PATH="$RUNNER_TEMP/wethaq-hardening.sqlite"
          rm -f "$DB_PATH" "$RUNNER_TEMP/wethaq-hardening.log"
          PORT="$HARDENING_PORT" DB_PATH="$DB_PATH" JWT_SECRET="$(openssl rand -hex 32)" OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' node server.js > "$RUNNER_TEMP/wethaq-hardening.log" 2>&1 &
          hardening_pid=$!
          trap 'kill "$pid" "$hardening_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if ! kill -0 "$hardening_pid" 2>/dev/null; then cat "$RUNNER_TEMP/wethaq-hardening.log"; exit 1; fi
            if curl -fsS --max-time 2 "http://127.0.0.1:$HARDENING_PORT/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 "http://127.0.0.1:$HARDENING_PORT/health" >/dev/null
          NODE_ENV=production node runtime-hardening.mjs
          timeout 90s env PORT="$HARDENING_PORT" node hardening-smoke.mjs

      - name: Build exact production APK and AAB
        shell: bash
        env:
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_KEY_PASSWORD: ${{ secrets.WETHAQ_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:clean :app:test :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace --console=plain

      - name: Enable KVM for Android 16
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Android 16 production APK smoke and startup baseline
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-linux-hw-accel: false
          script: |
            set -eu
            APK="app/build/outputs/apk/release/app-release.apk"
            adb logcat -c
            adb install -r "$APK"
            adb shell getprop ro.build.version.sdk | grep -qx '36'
            adb shell pm list packages | grep -Fq 'package:com.wethaq.app'
            adb shell am force-stop com.wethaq.app || true
            adb shell am start -W -n com.wethaq.app/.MainActivity 2>&1 | tee /tmp/wethaq-start.txt
            sleep 3
            adb logcat -d -v time > /tmp/wethaq-android16-logcat.txt || true
            echo "===== WETHAQ START RESULT ====="
            cat /tmp/wethaq-start.txt
            if adb shell pidof com.wethaq.app >/dev/null 2>&1; then
              echo 'WETHAQ_ANDROID16_STARTUP_OK'
            else
              echo 'WETHAQ_ANDROID16_STARTUP_FAILED'
              tail -n 500 /tmp/wethaq-android16-logcat.txt || true
              adb shell dumpsys activity activities | tail -n 120 || true
              exit 1
            fi
            TIMES_FILE="/tmp/wethaq-cold-start-times.txt"
            : > "$TIMES_FILE"
            for i in 1 2 3 4 5; do
              adb shell am force-stop com.wethaq.app
              out="$(timeout 30s adb shell am start -W -n com.wethaq.app/.MainActivity 2>/dev/null)"
              total="$(printf '%s
' "$out" | awk -F: '/TotalTime:/ {gsub(/[^0-9]/,"",$2); print $2; exit}')"
              test -n "$total"
              printf '%s
' "$total" >> "$TIMES_FILE"
              echo "cold_start_${i}_ms=${total}"
            done
            MEDIAN="$(sort -n "$TIMES_FILE" | awk 'NR==3{print;exit}')"
            test -n "$MEDIAN"
            echo "ANDROID16_COLD_START_MEDIAN_MS=$MEDIAN"
            adb shell dumpsys meminfo com.wethaq.app | awk '/TOTAL PSS/ {print "ANDROID16_TOTAL_PSS_KB="$3}' || true

      - name: Verify production APK, AAB, certificate and SHA-256
        shell: bash
        env:
          WETHAQ_KEYSTORE_PASSWORD: ${{ secrets.WETHAQ_KEYSTORE_PASSWORD }}
          WETHAQ_KEY_ALIAS: ${{ secrets.WETHAQ_KEY_ALIAS }}
          WETHAQ_CERT_SHA256: ${{ secrets.WETHAQ_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q 'Number of signers: 1' "$RUNNER_TEMP/apksigner.txt"
          EXPECTED_CERT="$(printf '%s' "$WETHAQ_CERT_SHA256" | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          APK_CERT_DIGEST="$(grep -i 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | head -n1 | sed 's/.*certificate SHA-256 digest:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "$APK_CERT_DIGEST" = "$EXPECTED_CERT" || { echo 'Production APK signer certificate fingerprint mismatch.'; exit 1; }
          KEYSTORE_CERT_DIGEST="$(keytool -list -v -keystore "$WETHAQ_KEYSTORE_PATH" -storepass "$WETHAQ_KEYSTORE_PASSWORD" -alias "$WETHAQ_KEY_ALIAS" | grep -i 'SHA256:' | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test "$KEYSTORE_CERT_DIGEST" = "$EXPECTED_CERT" || { echo 'Production keystore certificate fingerprint mismatch.'; exit 1; }
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          AAB_CERT_DIGEST="$(keytool -printcert -jarfile "$AAB" | grep -i '^[[:space:]]*SHA256:' | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -cd '0-9A-Fa-f' | tr '[:lower:]' '[:upper:]')"
          test -n "$AAB_CERT_DIGEST" || { echo 'Production AAB signer certificate fingerprint could not be read.'; exit 1; }
          test "$AAB_CERT_DIGEST" = "$EXPECTED_CERT" || { echo 'Production AAB signer certificate fingerprint mismatch.'; exit 1; }
          sha256sum "$APK" "$AAB" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          grep -Eq '^[0-9a-f]{64}[[:space:]]+app/build/outputs/apk/release/app-release.apk$' app/build/outputs/apk/release/SHA256SUMS.txt
          grep -Eq '^[0-9a-f]{64}[[:space:]]+app/build/outputs/bundle/release/app-release.aab$' app/build/outputs/apk/release/SHA256SUMS.txt
          echo "WETHAQ_PRODUCTION_SOURCE=$GITHUB_SHA" > app/build/outputs/apk/release/PROVENANCE.txt
          echo 'WETHAQ_PRODUCTION_APK_VERIFIED'
          echo 'WETHAQ_PRODUCTION_AAB_VERIFIED'
          echo "WETHAQ_PRODUCTION_CERT_SHA256=$EXPECTED_CERT"

      - name: Publish single protected production artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-production-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          SUMS='app/build/outputs/apk/release/SHA256SUMS.txt'
          TAG="wethaq-production-${GITHUB_SHA:0:12}"
          TITLE="Wethaq Production ${GITHUB_SHA:0:12}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" "$SUMS" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "Production build from commit $GITHUB_SHA. APK, AAB, certificate and SHA-256 were verified by the unified production gate."
          else
            gh release create "$TAG" "$APK" "$AAB" "$SUMS" --target "$GITHUB_SHA" --title "$TITLE" --notes "Production build from commit $GITHUB_SHA. APK, AAB, certificate and SHA-256 were verified by the unified production gate."
          fi

      - name: Secure cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$WETHAQ_KEYSTORE_PATH"                 "$RUNNER_TEMP/production-cert.txt"                 "$RUNNER_TEMP/apksigner.txt"

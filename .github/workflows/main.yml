name: بناء APK Release لتطبيق وَثاق

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/release-build

permissions:
  contents: read

jobs:
  build:
    name: Build Wethaq Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: ''
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Use the exact Wethaq founder photo from repository
        shell: bash
        run: |
          set -e
          SOURCE_PHOTO='Screenshot_٢٠٢٥١٢٢٠-٠١٢٦٠١_2.jpg'
          TARGET_PHOTO='app/src/main/res/drawable/profile_photo.jpg'
          test -s "$SOURCE_PHOTO"
          cp -f "$SOURCE_PHOTO" "$TARGET_PHOTO"
          sha256sum "$SOURCE_PHOTO" "$TARGET_PHOTO"
      - name: Add editable profile photo feature
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/wethaq/app
          cat > app/src/main/java/com/wethaq/app/AvatarActivity.kt <<'KOTLIN'
          package com.wethaq.app

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          class AvatarActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("wethaq_v10", Context.MODE_PRIVATE) }
              private val teal = Color.rgb(0, 137, 123)
              private val navy = Color.rgb(17, 38, 54)
              private val bg = Color.rgb(247, 249, 250)
              private val gray = Color.rgb(98, 112, 122)
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun button(text: String, action: () -> Unit) = TextView(this).apply {
                  this.text = text
                  textSize = 16f
                  setTextColor(Color.WHITE)
                  gravity = Gravity.CENTER
                  setPadding(dp(14), dp(10), dp(14), dp(10))
                  background = GradientDrawable().apply { setColor(teal); cornerRadius = dp(15).toFloat() }
                  setOnClickListener { action() }
              }
              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  window.statusBarColor = Color.WHITE
                  window.navigationBarColor = bg
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      setBackgroundColor(bg)
                      setPadding(dp(20), dp(28), dp(20), dp(20))
                  }
                  val title = TextView(this).apply { text = "الصورة الشخصية"; textSize = 24f; setTextColor(navy); gravity = Gravity.CENTER; typeface = android.graphics.Typeface.DEFAULT_BOLD }
                  root.addView(title, LinearLayout.LayoutParams(-1, dp(50)))
                  val image = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      background = GradientDrawable().apply { setColor(Color.WHITE); cornerRadius = dp(70).toFloat() }
                      clipToOutline = true
                      val uri = prefs.getString("avatar_uri", "") ?: ""
                      if (uri.isNotBlank()) setImageURI(Uri.parse(uri)) else setImageResource(com.wethaq.app.R.drawable.profile_photo)
                  }
                  root.addView(image, LinearLayout.LayoutParams(dp(180), dp(180)).apply { setMargins(0, dp(18), 0, dp(18)) })
                  val info = TextView(this).apply { text = "يمكنك اختيار صورة من هاتفك وتغييرها في أي وقت.\nالصورة تحفظ على هذا الجهاز."; textSize = 14f; setTextColor(gray); gravity = Gravity.CENTER }
                  root.addView(info, LinearLayout.LayoutParams(-1, dp(60)))
                  root.addView(button("🖼  اختيار أو تغيير الصورة") { pickImage() }, LinearLayout.LayoutParams(-1, dp(54)).apply { setMargins(0, dp(12), 0, dp(8)) })
                  val remove = TextView(this).apply { text = "حذف الصورة وإظهار الصورة الافتراضية"; textSize = 14f; setTextColor(navy); gravity = Gravity.CENTER; setOnClickListener { prefs.edit().remove("avatar_uri").apply(); image.setImageResource(com.wethaq.app.R.drawable.profile_photo) } }
                  root.addView(remove, LinearLayout.LayoutParams(-1, dp(46)))
                  root.addView(button("‹ العودة إلى ملفي") { finish() }, LinearLayout.LayoutParams(-1, dp(54)).apply { setMargins(0, dp(10), 0, 0) })
                  setContentView(root)
              }
              private fun pickImage() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/*"
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(intent, 7001)
              }
              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 7001 || resultCode != RESULT_OK) return
                  val uri = data?.data ?: return
                  try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) { }
                  prefs.edit().putString("avatar_uri", uri.toString()).apply()
                  recreate()
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          replacement='''    private fun profile() {\n        val r = root()\n        val c = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; layoutDirection = View.LAYOUT_DIRECTION_RTL; setPadding(dp(20), dp(12), dp(20), dp(20)) }\n        add(c, header("ملفي", "هوية وَثاق") { home() })\n        add(c, center(myName, 23f, navy, true), 45)\n        add(c, center("@$myId", 16f, teal, true), 45)\n        add(c, button("🖼  الصورة الشخصية") { startActivity(Intent(this, AvatarActivity::class.java)) }, 54, 0f, 6)\n        add(c, button("⧉  نسخ المعرف") { val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager; cm.setPrimaryClip(ClipData.newPlainText("Wethaq ID", myId)); toast("تم نسخ المعرف") }, 54, 0f, 8)\n        add(r, c, 0, 1f)\n        setContentView(r)\n    }\n\n'''
          marker='    private fun search('
          s2=re.sub(r'    private fun profile\(\) \{.*?\n    private fun search', replacement+'    private fun search', s, count=1, flags=re.S)
          if s2 == s:
              raise SystemExit('profile function patch target not found')
          p.write_text(s2,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          if 'android:name=".AvatarActivity"' not in s:
              s=s.replace('        <activity\n            android:name=".MainActivity"', '        <activity android:name=".AvatarActivity" android:exported="false" />\n        <activity\n            android:name=".MainActivity"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Create temporary release signing key
        shell: bash
        run: |
          set -e
          KEY_PASSWORD='wethaq-release-key'
          keytool -genkeypair -v -storetype PKCS12 -keystore "$RUNNER_TEMP/wethaq-release.keystore" -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -alias "wethaq" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wethaq, OU=Wethaq, O=Wethaq, L=Raqqa, ST=Syria, C=SY"
          echo "WETHAQ_KEYSTORE=$RUNNER_TEMP/wethaq-release.keystore" >> "$GITHUB_ENV"
          echo "WETHAQ_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_ALIAS=wethaq" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify Android project and exact photo
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/java/com/wethaq/app/AvatarActivity.kt
          test -f app/src/main/java/com/wethaq/app/BuildCompat.kt
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/drawable/profile_photo.jpg
          test "$(sha256sum 'Screenshot_٢٠٢٥١٢٢٠-٠١٢٦٠١_2.jpg' | awk '{print $1}')" = "$(sha256sum 'app/src/main/res/drawable/profile_photo.jpg' | awk '{print $1}')"
      - name: Apply Kotlin release-build compatibility fixes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('return@button','Unit')
          s=s.replace('return@identityForm','Unit')
          marker='    private fun button(s: String, action: () -> Unit, color: Int = teal) = TextView(this).apply {'
          overload='    private fun button(s: String, color: Int, action: () -> Unit) = button(s, action, color)\n'
          if overload not in s and marker in s:
              s=s.replace(marker, overload+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build signed Release APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare installable APK
        shell: bash
        run: |
          set -e
          APK_DIR='app/build/outputs/apk/release'
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/Wethaq-release-signed.apk"
          echo "WETHAQ_APK=$RUNNER_TEMP/Wethaq-release-signed.apk" >> "$GITHUB_ENV"
      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$WETHAQ_APK"
      - name: Upload installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Installable-Release-APK
          path: ${{ env.WETHAQ_APK }}
          if-no-files-found: error
          retention-days: 30

name: بناء APK Release لتطبيق وَثاق

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/release-build

permissions:
  contents: read

jobs:
  build:
    name: Build Wethaq Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: ''
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Use the exact Wethaq founder photo from repository
        shell: bash
        run: |
          set -e
          SOURCE_PHOTO='Screenshot_٢٠٢٥١٢٢٠-٠١٢٦٠١_2.jpg'
          TARGET_PHOTO='app/src/main/res/drawable/profile_photo.jpg'
          test -s "$SOURCE_PHOTO"
          cp -f "$SOURCE_PHOTO" "$TARGET_PHOTO"
          sha256sum "$SOURCE_PHOTO" "$TARGET_PHOTO"
      - name: Create temporary release signing key
        shell: bash
        run: |
          set -e
          KEY_PASSWORD='wethaq-release-key'
          keytool -genkeypair -v -storetype PKCS12 -keystore "$RUNNER_TEMP/wethaq-release.keystore" -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -alias "wethaq" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wethaq, OU=Wethaq, O=Wethaq, L=Raqqa, ST=Syria, C=SY"
          echo "WETHAQ_KEYSTORE=$RUNNER_TEMP/wethaq-release.keystore" >> "$GITHUB_ENV"
          echo "WETHAQ_STORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_ALIAS=wethaq" >> "$GITHUB_ENV"
          echo "WETHAQ_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify Android project and exact photo
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/java/com/wethaq/app/BuildCompat.kt
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/drawable/profile_photo.jpg
          test "$(sha256sum 'Screenshot_٢٠٢٥١٢٢٠-٠١٢٦٠١_2.jpg' | awk '{print $1}')" = "$(sha256sum 'app/src/main/res/drawable/profile_photo.jpg' | awk '{print $1}')"
      - name: Apply Kotlin release-build compatibility fixes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('return@button','Unit')
          s=s.replace('return@identityForm','Unit')
          marker='    private fun button(s: String, action: () -> Unit, color: Int = teal) = TextView(this).apply {'
          overload='    private fun button(s: String, color: Int, action: () -> Unit) = button(s, action, color)\n'
          if overload not in s and marker in s:
              s=s.replace(marker, overload+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build signed Release APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Prepare installable APK
        shell: bash
        run: |
          set -e
          APK_DIR='app/build/outputs/apk/release'
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/Wethaq-release-signed.apk"
          echo "WETHAQ_APK=$RUNNER_TEMP/Wethaq-release-signed.apk" >> "$GITHUB_ENV"
      - name: Verify APK signature
        shell: bash
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$WETHAQ_APK"
      - name: Upload installable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Installable-Release-APK
          path: ${{ env.WETHAQ_APK }}
          if-no-files-found: error
          retention-days: 30

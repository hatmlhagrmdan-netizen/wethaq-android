name: بناء APK Release لتطبيق وَثاق

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/release-build

permissions:
  contents: read

jobs:
  build:
    name: Build Wethaq Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/res/values/styles.xml
          echo "Checked out: $(git rev-parse HEAD)"
          echo "Branch/ref: ${GITHUB_REF}"

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify Release APK
        shell: bash
        run: |
          set -e
          APK='app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          echo "Package metadata:"
          aapt dump badging "$APK" | grep -E '^package:|^application-label:|^sdkVersion:|^targetSdkVersion:'
          echo "Release APK exists and was built successfully."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

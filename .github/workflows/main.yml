name: بناء APK Release لتطبيق وَثاق

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/release-build

permissions:
  contents: read

jobs:
  build:
    name: Build Wethaq Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/wethaq/app/MainActivity.kt
          test -f app/src/main/res/values/styles.xml
          echo "Checked out: $(git rev-parse HEAD)"
          echo "Branch/ref: ${GITHUB_REF}"

      - name: Build Release APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Locate Release APK
        shell: bash
        run: |
          set -e
          APK_DIR='app/build/outputs/apk/release'
          APK_PATH="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo 'ERROR: No Release APK was produced.'
            find app/build/outputs -type f -maxdepth 5 -print || true
            exit 1
          fi
          echo "Release APK: $APK_PATH"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Release-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

name: بناء تطبيق وَثاق

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: بناء APK
    runs-on: ubuntu-latest

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: فك المشروع
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q wethaq-android-project.zip -d android-project

      - name: تحديد المشروع
        id: project
        run: |
          SETTINGS=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "لم يتم العثور على مشروع Android"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: بناء APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

name: Activate Java8 Regex V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_java8_regex_v2.py'
      - '.github/workflows/activate-java8-regex-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply source repair
        run: |
          set -euo pipefail
          python3 scripts/fix_java8_regex_v2.py
          python3 -m py_compile scripts/fix_java8_regex_v2.py
          git diff --check
      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair Java 8 regex literals and finalize login UI'
          git push origin HEAD:main

name: Wethaq Final V2 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final repairs
        run: python3 scripts/finalize_v2.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release build
        run: chmod +x gradlew && ./gradlew clean assembleRelease

      - name: APK verification
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo "WETHAQ_FINAL_V2_APK_OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-V2-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

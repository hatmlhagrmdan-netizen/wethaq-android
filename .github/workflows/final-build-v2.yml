name: Wethaq Final V2 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static source validation
        run: |
          test -f app/src/main/java/com/wethaq/app/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle
          ! grep -RIn --exclude-dir=.git --exclude-dir=build --exclude='*.md' -E 'localhost|127\.0\.0\.1' app backend
          ! grep -n 'Base64.getDecoder().decode(m.optString("audio_data"))' app/src/main/java/com/wethaq/app/MainActivity.java
          ! find . -type f -path '*/__pycache__/*' -print -quit | grep -q .
          echo "SOURCE_SANITY_OK"

      - name: Compile and build release
        run: |
          echo "Building committed source: $(git rev-parse HEAD)"
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk
          echo "WETHAQ_FINAL_APK_OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-Production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

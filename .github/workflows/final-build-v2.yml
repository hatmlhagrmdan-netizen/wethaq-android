name: Wethaq CI Validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate committed source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          node --check backend/server.js
          grep -q 'personalCode' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'personal_code_hash' backend/server.js
          grep -q "auth:'name_birth_year_personal_code'" backend/server.js
          grep -q 'invalid_personal_code' backend/server.js
          grep -q 'scryptSync' backend/server.js
          grep -q 'timingSafeEqual' backend/server.js
          git diff --check
      - name: Baseline structural audit
        run: |
          set -euo pipefail
          python3 scripts/baseline_audit.py
          git diff --check
      - name: Backend native smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --no-audit --no-fund
          node -e "import('better-sqlite3').then(({default: Database})=>{const db=new Database(':memory:');db.prepare('select 1').get();db.close();console.log('BETTER_SQLITE3_NATIVE_OK')}).catch(e=>{console.error(e);process.exit(1)})"
          DB_FILE="$RUNNER_TEMP/wethaq-smoke.db"
          PORT=3100 DB_PATH="$DB_FILE" JWT_SECRET="$(openssl rand -hex 32)" OWNER_WETHAQ_ID='Hatem_Hussin_Al_Haj_Ramadan1995' node server.js > "$RUNNER_TEMP/wethaq-backend.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3100/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/health >/dev/null
          PORT=3100 node smoke-test.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Build CI release candidate
        run: gradle --no-daemon clean assembleCi
      - name: Verify CI APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/ci/app-ci.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/ci/SHA256SUMS.txt
          echo "WETHAQ_CI_APK_OK"
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-CI-Validation-APK
          path: |
            app/build/outputs/apk/ci/app-ci.apk
            app/build/outputs/apk/ci/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

name: Wethaq Final V2 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply production repairs
        run: |
          python3 scripts/final_repair.py
          python3 scripts/media_repair.py
          python3 scripts/ui_repair.py
          python3 scripts/video_repair.py
          python3 scripts/contact_repair.py
          python3 scripts/functional_repair.py
          python3 -m py_compile scripts/*.py
      - name: Normalize generated Java
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('n.split("\\s+")','n.split(" ")')
          s=s.replace('!y.matches("\\d{4}")','(y.length()!=4)')
          # The repair scripts may emit stale fn/fy identifiers. Keep auth scoped
          # to the method parameters n/y so the checked-in source compiles as-is.
          s=s.replace('q.put("name",fn);q.put("birthYear",Integer.parseInt(fy));','q.put("name",n);q.put("birthYear",Integer.parseInt(y));')
          s=s.replace('u.optString("name",fn)).put(YEAR,fy)','u.optString("name",n)).put(YEAR,y)')
          s=s.replace('final String fn=n.trim(),fy=y.trim();','n=n.trim();y=y.trim();')
          s=s.replace('q.put("name",fn);','q.put("name",n);')
          s=s.replace('Integer.parseInt(fy)','Integer.parseInt(y)')
          s=s.replace('u.optString("name",fn)','u.optString("name",n)')
          s=s.replace('.put(YEAR,fy)','.put(YEAR,y)')
          p.write_text(s,encoding='utf-8')
          text=p.read_text(encoding='utf-8')
          if 'q.put("name",fn)' in text or 'Integer.parseInt(fy)' in text or 'optString("name",fn)' in text or '.put(YEAR,fy)' in text:
              raise SystemExit('STALE_AUTH_IDENTIFIERS_REMAIN')
          print('JAVA_NORMALIZED_OK')
          PY
          grep -nE 'q\.put\("name",fn\)|Integer\.parseInt\(fy\)|optString\("name",fn\)|put\(YEAR,fy\)' app/src/main/java/com/wethaq/app/MainActivity.java && exit 1 || true
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and build release
        run: |
          gradle --no-daemon clean assembleRelease
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo "WETHAQ_FINAL_APK_OK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-Production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

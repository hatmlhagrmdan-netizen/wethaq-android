name: Wethaq Final V2 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply deterministic production repairs
        run: |
          python3 scripts/final_repair.py
          python3 scripts/media_repair.py
          python3 scripts/ui_repair.py
          python3 scripts/video_repair.py
          python3 scripts/contact_repair.py
          python3 scripts/functional_repair.py
          python3 -m py_compile scripts/*.py

      - name: Normalize generated Java and validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/wethaq/app/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('n.split("\\s+")','n.split(" ")')
          s=s.replace('!y.matches("\\d{4}")','(y.length()!=4)')
          s=s.replace('q.put("name",fn);q.put("birthYear",Integer.parseInt(fy));','q.put("name",n);q.put("birthYear",Integer.parseInt(y));')
          s=s.replace('u.optString("name",fn)).put(YEAR,fy)','u.optString("name",n)).put(YEAR,y)')
          p.write_text(s,encoding='utf-8')
          required=['private void auth(','private void home(','private void searchScreen(','private void contactsScreen(','private void conversation(','private void send()','private HttpResult request(']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('MISSING_METHODS:'+','.join(missing))
          if 'Base64.getDecoder().decode(m.optString("audio_data"))' in s:
              raise SystemExit('IMAGE_PAYLOAD_BUG_REMAINS')
          print('SOURCE_SANITY_OK')
          PY

      - name: Persist generated repairs before building
        run: |
          git config user.name "Wethaq Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts
          if ! git diff --cached --quiet; then
            git commit -m "fix: persist production source repairs [skip ci]"
            git push origin HEAD:main
          fi
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and build release
        run: |
          echo "Building committed source: $(git rev-parse HEAD)"
          gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          sha256sum app/build/outputs/apk/release/app-release.apk
          echo "WETHAQ_FINAL_APK_OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wethaq-Final-Production-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

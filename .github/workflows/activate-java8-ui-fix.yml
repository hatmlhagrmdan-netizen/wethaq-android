name: Activate Java8 UI Fix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_java_regex_and_login_ui.py'
      - '.github/workflows/activate-java8-ui-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 scripts/fix_java_regex_and_login_ui.py
          python3 -m py_compile scripts/fix_java_regex_and_login_ui.py
          node --check backend/server.js
          grep -q 'مدير ومؤسس وثاق حاتم حسين الحاج رمضان' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'menu("👥  الإدارة"' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'n.split("\\\\s+")' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'y.matches("\\\\d{4}")' app/src/main/java/com/wethaq/app/MainActivity.java
          grep -q 'code.matches("\\\\d{6,12}")' app/src/main/java/com/wethaq/app/MainActivity.java
          git diff --check
      - name: Commit source repair
        run: |
          set -euo pipefail
          if git diff --quiet -- app/src/main/java/com/wethaq/app/MainActivity.java; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java
          git commit -m 'fix: finalize Java 8 identity login and public administration entry'
          git push origin HEAD:main

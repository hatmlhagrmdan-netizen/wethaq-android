name: Wethaq V8 Repair

on:
  push:
    branches: [wethaq-v6-repair]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Extract V6 repair script safely
        shell: bash
        run: |
          awk '/^          python3 <<'"'"'PY'"'"'/{go=1;next}/^          PY$/{go=0}go{sub(/^          /,"",$0);print}' .github/workflows/wethaq-v6-repair.yml > /tmp/repair.py
          test -s /tmp/repair.py
          python3 -m py_compile /tmp/repair.py
          python3 /tmp/repair.py
      - name: Validate repaired source
        run: |
          git diff --check
          node --check backend/server.js
          grep -R "المناصب الإدارية مدفوعة\|20\\$ / سنة\|17\\$ / سنة\|12\\$ / سنة\|8\\$ / سنة\|addModerationTargetCard\|applyAudioRoute\|expires_at\|resolveUser" app/src/main/java backend/server.js >/dev/null
      - name: Backend hard health and smoke
        working-directory: backend
        shell: bash
        run: |
          npm install --no-audit --no-fund
          export DB_PATH="$RUNNER_TEMP/wethaq-v8.db"
          export JWT_SECRET="wethaq-v8-secret"
          export OWNER_WETHAQ_ID="Hatem_Hussin_Al_Haj_Ramadan1995"
          export PORT=3199
          node server.js > "$RUNNER_TEMP/wethaq-v8-server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request,os
          for _ in range(60):
            try:
              with urllib.request.urlopen('http://127.0.0.1:3199/health',timeout=1) as r:
                d=json.loads(r.read().decode())
                if r.status==200 and d.get('ok') is True:print('HEALTH_OK');break
            except Exception:pass
            time.sleep(.25)
          else:
            p=os.path.join(os.environ.get('RUNNER_TEMP','/tmp'),'wethaq-v8-server.log')
            print(open(p).read() if os.path.exists(p) else 'backend log unavailable')
            raise SystemExit('HEALTH_GATE_FAILED')
          PY
          node smoke-test.mjs
      - name: Build Release
        run: ./gradlew --no-daemon clean assembleRelease
      - name: Commit verified repairs
        shell: bash
        run: |
          git config user.name 'wethaq-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/wethaq/app/MainActivity.java app/src/main/java/com/wethaq/app/AdminActivity.java app/src/main/java/com/wethaq/app/PublicAdministrationActivity.java app/src/main/java/com/wethaq/app/WethaqMessageService.java app/src/main/java/com/wethaq/app/IncomingCallActionReceiver.java app/src/main/java/com/wethaq/app/VideoCallActivity.java app/src/main/AndroidManifest.xml backend/server.js
          if git diff --cached --quiet; then echo SOURCE_ALREADY_REPAIRED; else git commit -m 'feat: complete Wethaq V8 product repair' && git push origin HEAD:wethaq-v6-repair; fi
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wethaq-v8-repaired-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

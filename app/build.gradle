plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wethaq.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wethaq.app'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '2.2.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('WETHAQ_KEYSTORE_PATH')
            def keystorePassword = System.getenv('WETHAQ_KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('WETHAQ_KEY_ALIAS')
            def keyPassword = System.getenv('WETHAQ_KEY_PASSWORD')
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                this.keyAlias keyAlias
                this.keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def productionSigningReady = System.getenv('WETHAQ_KEYSTORE_PATH') &&
                    System.getenv('WETHAQ_KEYSTORE_PASSWORD') &&
                    System.getenv('WETHAQ_KEY_ALIAS') &&
                    System.getenv('WETHAQ_KEY_PASSWORD')
            signingConfig productionSigningReady ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

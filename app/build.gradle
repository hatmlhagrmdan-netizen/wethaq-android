plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wethaq.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wethaq.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('WETHAQ_KEYSTORE_PATH')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                def keystorePassword = System.getenv('WETHAQ_KEYSTORE_PASSWORD')
                def explicitKeyPassword = System.getenv('WETHAQ_KEY_PASSWORD')
                def alias = System.getenv('WETHAQ_KEY_ALIAS')
                storePassword keystorePassword
                keyAlias alias

                // Resolve key password robustly: prefer explicit key password, but if it fails to unlock the key, fall back to the keystore password.
                def resolvedKeyPassword = explicitKeyPassword
                if (resolvedKeyPassword == null || resolvedKeyPassword.trim().length() == 0) {
                    resolvedKeyPassword = keystorePassword
                } else {
                    try {
                        def ksObj = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
                        def fis = new java.io.FileInputStream(ks)
                        try {
                            ksObj.load(fis, (keystorePassword != null) ? keystorePassword.toCharArray() : null)
                            def key = ksObj.getKey(alias, resolvedKeyPassword.toCharArray())
                            if (key == null) {
                                // explicit password didn't work; fall back
                                resolvedKeyPassword = keystorePassword
                            }
                        } catch (Exception e) {
                            // any exception means explicit password didn't work; fall back
                            resolvedKeyPassword = keystorePassword
                        } finally {
                            fis.close()
                        }
                    } catch (Exception e) {
                        // if keystore can't be loaded for any reason, keep using keystore password as fallback
                        resolvedKeyPassword = keystorePassword
                    }
                }

                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('WETHAQ_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.webrtc:google-webrtc:1.0.30039@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

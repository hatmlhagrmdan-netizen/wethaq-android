plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wethaq.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wethaq.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('WETHAQ_KEYSTORE_PATH')
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('WETHAQ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WETHAQ_KEY_ALIAS')
                // Prefer explicit key password, but fall back to the keystore password if it's absent or empty.
                def explicitKeyPassword = System.getenv('WETHAQ_KEY_PASSWORD')
                if (explicitKeyPassword == null || explicitKeyPassword.trim().length() == 0) {
                    keyPassword System.getenv('WETHAQ_KEYSTORE_PASSWORD')
                } else {
                    keyPassword explicitKeyPassword
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (System.getenv('WETHAQ_KEYSTORE_PATH') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.webrtc:google-webrtc:1.0.30039@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

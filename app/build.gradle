plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wethaq.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wethaq.app'
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName '2.5.0'
    }

    signingConfigs {
        release {
            def releaseKeystorePath = System.getenv('WETHAQ_KEYSTORE_PATH')
            def releaseKeystorePassword = System.getenv('WETHAQ_KEYSTORE_PASSWORD')
            def releaseKeyAlias = System.getenv('WETHAQ_KEY_ALIAS')
            def releaseKeyPassword = System.getenv('WETHAQ_KEY_PASSWORD')
            if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        ci {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            versionNameSuffix '-ci'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.webrtc:google-webrtc:1.0.30039@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

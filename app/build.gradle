plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wethaq.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wethaq.app'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '2.4.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('WETHAQ_KEYSTORE_PATH')
            def keystorePassword = System.getenv('WETHAQ_KEYSTORE_PASSWORD')
            def keyAlias = System.getenv('WETHAQ_KEY_ALIAS')
            def keyPassword = System.getenv('WETHAQ_KEY_PASSWORD')
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                this.keyAlias keyAlias
                this.keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        ci {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            versionNameSuffix '-ci'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.webrtc:google-webrtc:1.0.30039@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

services:
  - type: web
    name: wethaq-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/wethaq.db
    disk:
      name: wethaq-data
      mountPath: /var/data
      sizeGB: 1
